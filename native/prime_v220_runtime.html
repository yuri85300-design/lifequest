// ExBurst ne fournit pas ici d'accès public fiable pour télécharger son catalogue.
const OFFICIAL_ART_BASE = 'https://raw.githubusercontent.com/ttiiggss/night-city-archive/main/images/';
const OFFICIAL_ART = Object.freeze(Object.fromEntries(Object.keys(CARDS).map(id => [
  id, OFFICIAL_ART_BASE + encodeURIComponent(OFFICIAL_SLUG[id] || id) + '.webp'
])));
const OFFLINE_ART = {}; // Blob URL : copies facultatives téléchargées dans IndexedDB.
// Français : scan original d'une impression FR, si disponible. Les adresses signées
// expirent : les scans récupérés sont conservés en IndexedDB sur cet appareil.
const LOCAL_FR_ART = Object.freeze({}); // Le script hors-ligne peut y inscrire images_vf/<id>.webp.
const FR_ART = {};
const FR_ART_REMOTE = {};
const isFrenchArt = id => !!(FR_ART[id] || LOCAL_FR_ART[id] || FR_ART_REMOTE[id]);
const cardArt = id => IMG[id] || FR_ART[id] || LOCAL_FR_ART[id] || FR_ART_REMOTE[id] || OFFLINE_ART[id] || OFFICIAL_ART[id] || null;
const isFrenchVisible = id => !IMG[id] && isFrenchArt(id);

const FrenchArt = {
  db: null, disabled: false, busy: false, pending: {}, tried: {}, missing: {},
  base: 'https://api.netdeck.gg/api/cards/cyberpunk',
  async open() {
    if (this.db) return true;
    return new Promise(resolve => {
      try {
        const q = indexedDB.open('septgigs-french-art', 1);
        q.onupgradeneeded = () => q.result.createObjectStore('cards');
        q.onsuccess = () => { this.db = q.result; resolve(true); };
        q.onerror = () => resolve(false);
        q.onblocked = () => resolve(false);
      } catch { resolve(false); }
    });
  },
  async loadAll() {
    if (!(await this.open())) return 0;
    return new Promise(resolve => {
      let n = 0;
      try {
        const q = this.db.transaction('cards', 'readonly').objectStore('cards').openCursor();
        q.onsuccess = () => {
          const c = q.result;
          if (!c) return resolve(n);
          if (CARDS[c.key] && c.value instanceof Blob && c.value.size > 900) {
            FR_ART[c.key] = URL.createObjectURL(c.value); n++;
          }
          c.continue();
        };
        q.onerror = () => resolve(n);
      } catch { resolve(n); }
    });
  },
  async save(id, blob) {
    if (!(await this.open())) return false;
    return new Promise(resolve => {
      try {
        const tx = this.db.transaction('cards', 'readwrite');
        tx.objectStore('cards').put(blob, id);
        tx.oncomplete = () => {
          if (FR_ART[id]) URL.revokeObjectURL(FR_ART[id]);
          FR_ART[id] = URL.createObjectURL(blob); resolve(true);
        };
        tx.onerror = () => resolve(false);
        tx.onabort = () => resolve(false);
      } catch { resolve(false); }
    });
  },
  status(id) {
    if (isFrenchVisible(id)) return 'Version française officielle';
    if (IMG[id]) return 'Photo personnelle';
    if (this.pending[id]) return 'Recherche du visuel français…';
    if (this.missing[id]) return 'Pas de scan français trouvé';
    if (this.disabled || this.tried[id]) return 'Scan français indisponible sur ce navigateur';
    return 'Lecture en français · illustration provisoire EN';
  },
  sourceIsFrench(p) {
    const s = p?.set || {};
    const str = [typeof s === 'string' ? s : s?.name, s?.code, p?.language, p?.lang, p?.locale, p?.lang_code]
      .filter(Boolean).join(' ').toLowerCase();
    return /(?:\bfr\b|\bfrench\b|\bfrançais\b|\bfrancaise\b|retail\s*[—-]\s*fr\b)/i.test(str);
  },
  async getDetail(id) {
    const slug = OFFICIAL_SLUG[id] || id;
    const u = this.base + '/' + encodeURIComponent(slug);
    const res = await fetch(u, { mode: 'cors', headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('API HTTP ' + res.status);
    const body = await res.json();
    const d = body.item || body.data || (Array.isArray(body.items) ? body.items[0] : body);
    if (!d || typeof d !== 'object') throw new Error('Fiche officielle manquante');
    return d;
  },
  pickPrinting(id, obj) {
    const candidates = Array.isArray(obj.printings) ? [...obj.printings] : [];
    if (!candidates.includes(obj)) candidates.push(obj);
    const fr = candidates.filter(p => this.sourceIsFrench(p) && (p.image_url || p.source_image_url));
    const wanted = String(window.CARD_META?.num?.[id] ?? '').replace(/^0+/, '');
    fr.sort((a,b) => {
      const rank = p => {
        const n = String(p.print_number ?? p.collector_number ?? p.number ?? '').replace(/^0+/, '');
        const label = [p.set?.name, p.set?.code].join(' ').toLowerCase();
        return (wanted && n === wanted ? 100 : 0) + (label.includes('retail') ? 20 : 0) + (p.image_url ? 5 : 0);
      };
      return rank(b)-rank(a);
    });
    return fr[0] || null;
  },
  refresh(id) {
    const url = cardArt(id);
    document.querySelectorAll('[data-fr-card]').forEach(el => {
      if (el.dataset.frCard !== id) return;
      if (el.matches('.mini')) {
        if (url) { el.style.setProperty('--ph', 'url("' + url.replace(/"/g, '%22') + '")'); el.classList.add('has-img'); }
      } else if (el.matches('.combat-preview-image')) {
        const pic = el.querySelector('.combat-preview-portrait');
        if (pic && url && pic.getAttribute('src') !== url) {
          el.classList.remove('preview-loaded', 'preview-failed');
          pic.src = url;
        }
      } else if (el.matches('.bigcard')) {
        el.classList.toggle('art-fr-ready', isFrenchVisible(id));
        el.classList.toggle('art-fallback-en', !isFrenchVisible(id));
        const pic = el.querySelector('[data-vf-portrait]');
        if (pic && url && pic.getAttribute('src') !== url) pic.src = url;
        el.classList.remove('image-failed');
      }
    });
    document.querySelectorAll('[data-vf-status]').forEach(el => {
      if (el.dataset.vfStatus === id) el.textContent = this.status(id);
    });
    document.querySelectorAll('[data-vf-help]').forEach(el => {
      if (el.dataset.vfHelp === id) el.textContent = isFrenchVisible(id)
        ? 'Scan de la carte officielle en français.'
        : 'Illustration de référence ; les effets en français apparaissent au-dessus.';
    });
  },
  async ensure(id, force = false) {
    if (!CARDS[id]) return false;
    if (isFrenchArt(id)) return true;
    if (this.pending[id]) return this.pending[id];
    if (!force && (this.disabled || this.tried[id])) return false;
    this.tried[id] = true;
    const work = (async () => {
      try {
        const d = await this.getDetail(id);
        const p = this.pickPrinting(id, d);
        if (!p) { this.missing[id] = true; return false; }
        const url = p.image_url || p.source_image_url;
        if (!/^https:\/\//i.test(url)) throw new Error('URL de visuel invalide');
        // Sans CORS sur le CDN, l'image peut tout de même s'afficher,
        // mais ne pourra être enregistrée hors-ligne.
        FR_ART_REMOTE[id] = url;
        this.refresh(id);
        try {
          const r = await fetch(url, { mode: 'cors', cache: 'no-store' });
          if (!r.ok) throw new Error('image HTTP ' + r.status);
          const blob = await r.blob();
          if ((blob.type.startsWith('image/') || !blob.type) && blob.size > 900 && blob.size < 8_000_000)
            await this.save(id, blob);
        } catch { /* scan FR affiché en ligne même sans cache local */ }
        return true;
      } catch (e) {
        if (e instanceof TypeError) this.disabled = true; // Échec réseau/CORS : éviter 150 requêtes inutiles.
        return false;
      } finally {
        delete this.pending[id]; this.refresh(id);
      }
    })();
    this.pending[id] = work;
    this.refresh(id);
    return work;
  },
  async installAll(progress) {
    if (this.busy) return { ok:0, missing:0, failed:0, total:0 };
    this.busy = true;
    let done=0, ok=0, missing=0, failed=0;
    const ids = Object.keys(CARDS).filter(id => !isFrenchArt(id));
    let next = 0;
    try {
      const worker = async () => {
        while (next < ids.length && !this.disabled) {
          const id = ids[next++];
          const result = await this.ensure(id, true);
          if (result) ok++; else if (this.missing[id]) missing++; else failed++;
          if (progress) progress(++done, ids.length, ok, missing, failed);
        }
      };
      await Promise.all(Array.from({ length: Math.min(2,ids.length) }, () => worker()));
      return { ok, missing, failed, total:ids.length, stopped:this.disabled };
    } finally { this.busy = false; }
  },
};

// Option de téléchargement local : les cartes sont illustrées en ligne dès l'ouverture.
// Le cache permet ensuite l'affichage sur cet appareil, même sans réseau.
const ArtCache = {
  db: null, available: true, busy: false,
  async open() {
    if (this.db) return true;
    return new Promise(resolve => {
      try {
        const rq = indexedDB.open('septgigs-official-art', 1);
        rq.onupgradeneeded = () => { if (!rq.result.objectStoreNames.contains('cards')) rq.result.createObjectStore('cards'); };
        rq.onsuccess = () => { this.db = rq.result; resolve(true); };
        rq.onerror = () => { this.available = false; resolve(false); };
        rq.onblocked = () => { this.available = false; resolve(false); };
      } catch (_) { this.available = false; resolve(false); }
    });
  },
  async loadAll() {
    if (!(await this.open())) return 0;
    return new Promise(resolve => {
      let n = 0;
      try {
        const rq = this.db.transaction('cards', 'readonly').objectStore('cards').openCursor();
        rq.onsuccess = () => {
          const cur = rq.result;
          if (!cur) { resolve(n); return; }
          if (CARDS[cur.key] && cur.value instanceof Blob && cur.value.size > 1000) {
            if (OFFLINE_ART[cur.key]) URL.revokeObjectURL(OFFLINE_ART[cur.key]);
            OFFLINE_ART[cur.key] = URL.createObjectURL(cur.value);
            n++;
          }
          cur.continue();
        };
        rq.onerror = () => resolve(n);
      } catch (_) { resolve(n); }
    });
  },
  async put(id, blob) {
    if (!this.db) return false;
    return new Promise(resolve => {
      try {
        const tx = this.db.transaction('cards', 'readwrite');
        tx.objectStore('cards').put(blob, id);
        tx.oncomplete = () => {
          if (OFFLINE_ART[id]) URL.revokeObjectURL(OFFLINE_ART[id]);
          OFFLINE_ART[id] = URL.createObjectURL(blob);
          resolve(true);
        };
        tx.onerror = () => resolve(false);
        tx.onabort = () => resolve(false);
      } catch (_) { resolve(false); }
    });
  },
  async installAll(progress) {
    if (this.busy) return { ok: 0, failed: 0, total: 0 };
    this.busy = true;
    let ok = 0, failed = 0, completed = 0;
    const ids = Object.keys(CARDS).filter(id => !OFFLINE_ART[id]);
    let next = 0;
    try {
      if (!(await this.open())) return { ok, failed: ids.length, total: ids.length, unavailable: true };
      const worker = async () => {
        while (next < ids.length) {
          const id = ids[next++];
          try {
            const response = await fetch(OFFICIAL_ART[id], { mode: 'cors', cache: 'force-cache' });
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const blob = await response.blob();
            if (!blob.type.startsWith('image/') || blob.size < 1000 || blob.size > 5_000_000) throw new Error('Fichier image invalide');
            if (await this.put(id, blob)) ok++; else failed++;
          } catch (_) { failed++; }
          completed++;
          if (progress) progress(completed, ids.length, ok, failed);
        }
      };
      await Promise.all(Array.from({ length: Math.min(4, ids.length) }, () => worker()));
      return { ok, failed, total: ids.length };
    } finally { this.busy = false; }
  },
  async clear() {
    if (!(await this.open())) return false;
    return new Promise(resolve => {
      try {
        const tx = this.db.transaction('cards', 'readwrite');
        tx.objectStore('cards').clear();
        tx.oncomplete = () => {
          for (const id of Object.keys(OFFLINE_ART)) { URL.revokeObjectURL(OFFLINE_ART[id]); delete OFFLINE_ART[id]; }
          resolve(true);
        };
        tx.onerror = () => resolve(false);
      } catch (_) { resolve(false); }
    });
  }
};
const Photos = {
  db: null, ok: true,
  open() {
    return new Promise(res => {
      try {
        const rq = indexedDB.open('septgigs', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('img');
        rq.onsuccess = () => { this.db = rq.result; res(true); };
        rq.onerror = () => { this.ok = false; res(false); };
      } catch (e) { this.ok = false; res(false); }
    });
  },
  tx(mode) { return this.db.transaction('img', mode).objectStore('img'); },
  async loadAll() {
    if (!(await this.open())) return;
    await new Promise(res => { try { const st = this.tx('readonly'); const rq = st.openCursor(); rq.onsuccess = () => { const c = rq.result; if (c) { if (CARDS[c.key]) IMG[c.key] = URL.createObjectURL(c.value); c.continue(); } else res(); }; rq.onerror = () => res(); } catch (e) { res(); } });
  },
  async put(id, blob) {
    if (IMG[id]) URL.revokeObjectURL(IMG[id]);
    IMG[id] = URL.createObjectURL(blob);
    if (this.db) try { this.tx('readwrite').put(blob, id); } catch (e) { this.ok = false; }
  },
  del(id) { if (IMG[id]) URL.revokeObjectURL(IMG[id]); delete IMG[id]; if (this.db) try { this.tx('readwrite').delete(id); } catch (e) { /* rien */ } },
  clear() { for (const id of Object.keys(IMG)) this.del(id); },
};
// redimensionne une image importée (≤ 640 px de haut, JPEG)
function shrink(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = () => { const k = Math.min(1, 640 / Math.max(im.naturalHeight, im.naturalWidth)); const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); c.toBlob(b => (b ? res(b) : rej(new Error('image'))), 'image/jpeg', 0.84); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Image illisible')); };
    im.src = url;
  });
}
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function matchCard(filename) {
  const base = norm(filename.replace(/\.[a-z0-9]+$/i, ''));
  let best = null, bl = 0;
  for (const d of Object.values(CARDS)) for (const key of [d.id, OFFICIAL_SLUG[d.id], norm(cardName(d)), norm(cardNameEn(d))]) {
    if (key && base.includes(key) && key.length > bl) { best = d.id; bl = key.length; }
  }
  return best;
}
function pickFiles(multiple) {
  return new Promise(res => { const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = !!multiple; inp.style.display = 'none'; inp.onchange = () => { res([...inp.files]); inp.remove(); }; app.appendChild(inp); inp.click(); });
}
async function addPhoto(id) {
  const [f] = await pickFiles(false); if (!f) return false;
  try { await Photos.put(id, await shrink(f)); toast(Photos.ok ? 'Photo ajoutée' : 'Photo ajoutée pour cette session seulement'); return true; } catch (e) { toast('Cette image ne peut pas être lue'); return false; }
}
async function bulkImport() {
  const files = await pickFiles(true); if (!files.length) return;
  let ok = 0; const miss = [];
  for (const f of files) { const id = matchCard(f.name); if (!id) { miss.push(f.name); continue; } try { await Photos.put(id, await shrink(f)); ok++; } catch (e) { miss.push(f.name); } }
  toast(`${ok} photo(s) associée(s)${miss.length ? `, ${miss.length} sans carte correspondante` : ''}`, 3200);
}

const DIE_SHAPE = { 4: 'M20 4 37 34 3 34Z', 6: 'M6 6h28v28H6Z', 8: 'M20 2 37 20 20 38 3 20Z', 10: 'M20 2 36 16 20 38 4 16Z', 12: 'M20 3 37 15 31 36 9 36 3 15Z', 20: 'M20 2 36 11 36 29 20 38 4 29 4 11Z' };
function dieSVG(sides, value, color, opts = {}) {

}

// ------------------------------------------------- illustration générée --
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const FC_HEX = { Red: '#e5484d', Yellow: '#efc32f', Green: '#3fbf7f', Blue: '#4c8df6' };
function artSVG(id) {
  const d = CARDS[id]; let s = hash(id); const r = () => { s = Math.imul(s ^ (s >>> 15), 2246822507) >>> 0; s = (s ^ (s >>> 13)) >>> 0; return (s % 10000) / 10000; };
  const c = FC_HEX[d.color]; let out = '';
  // pluie
  for (let k = 0; k < 26; k++) { const x = r() * 300, y = r() * 92; out += `<line x1="${x}" y1="${y}" x2="${x - 5}" y2="${y + 14}" stroke="#9fb2c3" stroke-opacity=".18" stroke-width="1"/>`; }
  // enseigne néon
  const sx = 20 + r() * 220, sy = 8 + r() * 26, sw = 26 + r() * 50;
  out += `<rect x="${sx}" y="${sy}" width="${sw}" height="${8 + r() * 10}" rx="2" fill="none" stroke="${c}" stroke-width="2.5"/><rect x="${sx}" y="${sy}" width="${sw}" height="18" fill="${c}" opacity=".12" filter="url(#b)"/>`;
  // silhouette de ville
  let x = 0;
  while (x < 300) {
    const w = 14 + r() * 34, hgt = 26 + r() * 58;
    out += `<rect x="${x}" y="${92 - hgt}" width="${w}" height="${hgt}" fill="#0c151e"/>`;
    for (let wy = 92 - hgt + 5; wy < 88; wy += 7) for (let wx = x + 3; wx < x + w - 3; wx += 6) if (r() < .16) out += `<rect x="${wx}" y="${wy}" width="2.5" height="3" fill="${r() < .3 ? c : '#ffb347'}" opacity=".75"/>`;
    x += w + 1;
  }
  return `<svg viewBox="0 0 300 92" preserveAspectRatio="xMidYMid slice"><defs><filter id="b"><feGaussianBlur stdDeviation="6"/></filter><linearGradient id="sky${s % 999}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101b26"/><stop offset="1" stop-color="${c}" stop-opacity=".28"/></linearGradient></defs><rect width="300" height="92" fill="url(#sky${s % 999})"/>${out}</svg>`;
}

function fmtText(t) {
  if (!t) return '<p style="color:var(--fog)">Pas de capacité.</p>';
  let x = esc(t);
  x = x.replace(/\[(JEU|ATTAQUE|APPEL|VAINCU)\]/g, '<span class="kw trig">$1</span>')
    .replace(/\[(RAPIDE|SOLO|BLOQUEUR|ADRÉNALINE)\]/g, (m, k) => `<span class="kw">${k === 'SOLO' ? 'EN SOLO' : k}</span>`)
    .replace(/\[⟳\]/g, '<span class="kw spend" title="Épuiser cette carte">⟳</span>');
  return x.split('\n').map(p => `<p>${p}</p>`).join('');
}
const cardName = d => (d.sub ? `${d.name} — ${d.sub}` : d.name);
const cardNameEn = d => (d.subEn ? `${d.nameEn} — ${d.subEn}` : (d.nameEn || d.name));
function voLine(d) { const en = cardNameEn(d); if (!d.nameEn || norm(en) === norm(cardName(d))) return d.frUnofficial ? '<small class="vo">Nom français non officiel</small>' : ''; return `<small class="vo">VO : ${esc(en)}${d.frUnofficial ? ' (nom français non officiel)' : ''}</small>`; }
const searchable = d => (cardName(d) + ' ' + cardNameEn(d) + ' ' + d.txt + ' ' + d.tags.join(' ')).toLowerCase();

function miniHTML(id, opt = {}) {
  const d = CARDS[id]; const g = S.game; const inst = opt.inst;

  if (inst && g && opt.live) { const e = g.eff(inst); if (d.power != null || e) { pcls = e > (d.power ?? 0) ? 'up' : e < (d.power ?? 0) ? 'down' : ''; pw = e; } }
  const showPw = d.type === 'Unit' || (d.type === 'Legend' && d.power != null) || (d.type === 'Gear');
  const pwTxt = d.type === 'Gear' ? `+${d.power ?? 0}` : (pw ?? '');
  const badges = [];
  if (inst && opt.live) {
    if (inst.gear.length) badges.push(`⚙${inst.gear.length}`);
    if (inst.lag && g.onField(inst)) badges.push('Lag');
    if (g.onField(inst) && g.hasKw(inst, 'BLOCKER')) badges.push('Bloq');
  }
  const ph = cardArt(id);

function bigCardHTML(id, inst) {
  const d = CARDS[id]; const g = S.game;
  const tagStr = d.tags.length ? ' — ' + d.tags.map(t => t.toLowerCase().replace(/(^|[\s-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase())).join(', ') : '';
  const fem = d.type === 'Legend' || d.type === 'Unit';
  const colAdj = ({ Red: 'rouge', Yellow: 'jaune', Green: fem ? 'verte' : 'vert', Blue: fem ? 'bleue' : 'bleu' })[d.color];
  let state = '';
  if (inst && g) {
    const w = g.where(inst.uid); const bits = [];
    if (w && (w.zone === 'field' || w.zone === 'legends')) {
      bits.push(inst.ready ? 'Prête' : 'Épuisée');
      if (w.zone === 'field' && inst.lag) bits.push('Latence (jouée ce tour)');
      if (w.zone === 'field' || d.power != null) { const e = g.eff(inst); if (e !== (d.power ?? 0)) bits.push(`Puissance actuelle ${e}`); }
      for (const gr of inst.gear) bits.push(`Équipée : ${CARDS[gr.id].name} (+${CARDS[gr.id].power ?? 0})`);
      for (const m of inst.mods) { if (m.power) bits.push(`${m.power > 0 ? '+' : ''}${m.power} ${m.fightOnly ? 'en combat ' : ''}${m.dur === 'turn' ? 'ce tour' : 'jusqu\'au prochain tour'}`); if (m.flag === 'cantAttack') bits.push('Ne peut pas attaquer'); if (m.flag === 'mustAttack') bits.push('Doit attaquer'); if (m.flag === 'noReady') bits.push('Ne peut pas se redresser'); if (m.flag === 'noFightDefeat') bits.push('Invaincue en combat ce tour'); if (m.flag === 'rushUnits') bits.push('Peut attaquer des Unités ce tour'); }
      for (const gk of inst.grants) bits.push(`Gagne ${gk.kw === 'BLOCKER' ? 'BLOQUEUR' : gk.kw === 'ADRENALINE' ? 'ADRÉNALINE' : gk.kw} ce tour`);
      if (inst.flags.solo) bits.push('Partie EN SOLO');
    }
    if (bits.length) state = `<div class="state">${bits.map(b => `<span>${esc(b)}</span>`).join('')}</div>`;
  }
  const pw = d.type === 'Gear' ? `+${d.power ?? 0}<small>puissance</small>` : d.power != null ? `${d.power}<small>puissance</small>` : '';
  return `<div class="bigcard fc-${d.color} ${isFrenchVisible(id) ? 'art-fr-ready' : 'art-fallback-en'}" data-fr-card="${id}"><div class="bar"></div><header><div class="bcost ${d.cost == null ? 'null' : ''}">${d.cost ?? '–'}${d.sell ? '<small class="bcost-sell">€$</small>' : ''}</div><div class="bn"><b>${esc(d.name)}</b>${d.sub ? `<i>${esc(d.sub)}</i>` : ''}${voLine(d)}</div></header>` +
    (cardArt(id) ? `<div class="photo"><img data-vf-portrait src="${esc(cardArt(id))}" alt="Illustration de ${esc(cardName(d))}" loading="lazy" decoding="async" onerror="this.closest('.bigcard').classList.add('image-failed')"></div><div class="art image-fallback">${artSVG(id)}</div>` : `<div class="art">${artSVG(id)}</div>`) + `<div class="typeline"><b>${TYPE_FR[d.type]} ${colAdj}</b>${esc(tagStr)}</div>` +
    `<div class="txt">${fmtText(d.txt)}</div>${state}<footer><span>RAM ${COLOR_FR[d.color]} ${d.ram ?? '–'}${d.sell ? (d.type === 'Legend' ? ', €$ : peut payer une fois visible' : ', €$ : vendable') : ', sans symbole de vente'}</span><span class="bpw">${pw}</span></footer></div>`;
}

function showCard(id, inst, actionsHTML = '', manage = false) {
  const extra = manage ? `<div class="row2"><button class="btn small" data-ph>${IMG[id] ? 'Changer la photo' : 'Ajouter une photo'}</button>${IMG[id] ? '<button class="btn small ghost" data-rmph>Retirer la photo</button>' : `<a class="btn small ghost" href="${officialURL(id)}" target="_blank" rel="noopener">Carte officielle</a>`}</div>${IMG[id] ? `<a class="btn small ghost" href="${officialURL(id)}" target="_blank" rel="noopener">Voir la carte officielle</a>` : ''}` : `<a class="btn small ghost" href="${officialURL(id)}" target="_blank" rel="noopener">Voir la carte officielle</a>`;

    ${inst && inst.gear && inst.gear.length ? `<div class="revealed" style="margin-top:10px">${inst.gear.map(gr => miniHTML(gr.id, { attrs: `data-gear="${gr.uid}"` })).join('')}</div>` : ''}</div>${actionsHTML ? `<div class="acts">${actionsHTML}</div>` : ''}<div class="acts"><button class="btn ghost" data-close>Fermer</button></div>`);

  if (retry) retry.onclick = () => { FrenchArt.disabled = false; delete FrenchArt.tried[id]; FrenchArt.ensure(id, true); };

  return sc;
}

// Combat : un toucher montre uniquement la carte, avec les actions en dessous.
// Le bouton « Lire l'effet » conserve la fiche française complète sur demande.
function showCombatPreview(id, inst, actions = [], run = () => {}) {
  const d = CARDS[id];
  if (!d) return null;
  // Only engine-authorized moves. Prioritize Gig steals, then combat, play and effects.
  const priority = action => action.type === 'attack' && action.target?.kind === 'gigs' ? 0
      : action.type === 'attack' ? 1 : action.type === 'play' ? 2
      : action.type === 'activate' ? 3 : action.type === 'solo' ? 4
      : action.type === 'sell' ? 5 : 6;
  const available = actions.slice().sort((a,b)=>priority(a)-priority(b));
  const art = cardArt(id);
  const portrait = art ? esc(art) : '';
  const sc = openSheet(`<div class="combat-preview-root">
    <div class="combat-preview-image" data-fr-card="${id}" aria-label="Illustration de ${esc(cardName(d))}">
      <img class="combat-preview-portrait" ${art ? `src="${portrait}"` : ''}
        alt="${esc(cardName(d))}" decoding="async"
        onload="this.parentElement.classList.add('preview-loaded');this.parentElement.classList.remove('preview-failed')"
        onerror="this.parentElement.classList.add('preview-failed');this.parentElement.classList.remove('preview-loaded')" />
      <div class="combat-preview-fallback">${artSVG(id)}</div>
    </div>
    ${available.length ? `<div class="combat-preview-actions">${actsButtons(S.game,available)}</div>`
      : '<div class="combat-preview-empty">Aucune action disponible avec cette carte pour le moment.</div>'}
    <div class="combat-preview-toolbar">
      <button type="button" data-preview-details>Lire l’effet</button>
      <button type="button" data-preview-close>Retour au duel</button>
    </div>
  </div>`, {noFocus:true});
  sc.classList.add('combat-preview-modal');
  sc.querySelector('[data-preview-close]').onclick = closeSheet;
  sc.querySelector('[data-preview-details]').onclick = () => showCard(id, inst);
  sc.querySelectorAll('.combat-preview-actions [data-a]').forEach((b,k) => {
    if (available[k]?.type === 'attack' && available[k].target?.kind === 'gigs') b.setAttribute('data-combat-primary','true');
  });
  bindActs(sc, available, action => { closeSheet(); run(action); });
  if (!isFrenchArt(id) && !FrenchArt.tried[id]) FrenchArt.ensure(id);
  return sc;
}

function safeStats(){
  const x=S.stats||{};return {games:Math.max(0,+x.games||0),wins:Math.max(0,+x.wins||0),
    losses:Math.max(0,+x.losses||0),draws:Math.max(0,+x.draws||0),turns:Math.max(0,+x.turns||0),
    history:Array.isArray(x.history)?x.history.slice(-30):[],
    campaignCleared:Math.min(CAMPAIGN_MISSIONS.length,Math.max(0,+x.campaignCleared||0))};
}
function recordDuel(res,g,missionIndex=null){
  const st=safeStats();st.games++;
  if(res.winner===HUMAN)st.wins++;
  else if(res.winner===AI)st.losses++;
  else st.draws++;
  const turns=Math.max(0,Math.ceil((g.s.turn||0)/2));st.turns+=turns;
  st.history.push({date:new Date().toISOString(),result:res.winner===HUMAN?'victoire':res.winner===AI?'défaite':'égalité',
    turns,deck:S.myDeck,level:S.level,gigs:g.P(HUMAN).gigs.length,enemyGigs:g.P(AI).gigs.length});
  st.history=st.history.slice(-30);
  if(res.winner===HUMAN && Number.isInteger(missionIndex) && missionIndex===st.campaignCleared) st.campaignCleared++;
  S.stats=st;store.set('matchStatsV1',st);
}

const HUMAN = 0, AI = 1;
const Human = {
  dieScore() { return 0; },
  mulligan(g, i) {
    return new Promise(res => {
      const p = g.P(i);
      const sc = openSheet(`<h4>Votre main de départ</h4><p class="sub">Vous pouvez la remélanger une seule fois et piocher 6 nouvelles cartes.</p><div class="body"><div class="revealed" style="flex-wrap:wrap">${p.hand.map(c => miniHTML(c.id, { attrs: `data-see="${c.id}"` })).join('')}</div></div><div class="row2" style="margin-top:10px"><button class="btn ghost" data-m="1">Mulligan</button><button class="btn primary" data-m="0">Garder</button></div>`, { modal: true });
      sc.querySelectorAll('[data-see]').forEach(b => b.onclick = () => { const back = sc; const s2 = showCard(b.dataset.see); s2.querySelector('[data-close]').onclick = () => { closeSheet(); app.appendChild(back); S.sheet = back; }; });
      sc.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { closeSheet(); res(b.dataset.m === '1'); });
    });
  },
  choose(g, i, req) { return choiceSheet(g, i, req); },
  react(g, i, A, acts) { return reactSheet(g, i, A, acts); },
  mainAction(g, i, acts) { return new Promise(res => { S.acts = acts; S.resolveMain = a => { S.resolveMain = null; S.acts = []; closeSheet(); res(a); }; render(); }); },
};

function choiceSheet(g, i, req) {
  return new Promise(res => {
    const multi = req.max > 1;
    const sel = new Set();
    const optHTML = req.options.map((o, k) => {
      let left = '', title = esc(o.label), small = '';
      if (o.card) { const d = CARDS[o.card.id]; left = miniHTML(o.card.id, { inst: o.card, live: g.onField(o.card) }); title = esc(cardName(d)); const w = g.where(o.card.uid); small = w ? ({ field: g.controllerOf(o.card) === HUMAN ? 'Votre terrain' : 'Terrain adverse', hand: 'Votre main', trash: 'Rebut', legends: 'Légende', deck: 'Deck' }[w.zone] || '') : ''; if (d.type === 'Unit' && w && w.zone === 'field') small += `, puissance ${g.eff(o.card)}${o.card.ready ? '' : ', épuisée'}`; }
      else if (o.gig) { const mine = g.P(HUMAN).gigs.includes(o.gig); left = `<span style="width:40px;height:40px;display:inline-block">${dieSVG(o.gig.sides, o.gig.value, mine ? '#ffb347' : '#f2668b')}</span>`; small = mine ? 'Votre Gig' : 'Gig adverse'; }
      else if (/^d\d+$/.test(o.label)) { left = `<span style="width:40px;height:40px;display:inline-block">${dieSVG(+o.label.slice(1), null, '#ffb347', { empty: true })}</span>`; }
      return `<button class="opt" data-k="${k}">${left}<span class="t"><b>${title}</b>${small ? `<small>${esc(small)}</small>` : ''}</span></button>`;
    }).join('');
    const reveal = req.revealCards && req.revealCards.length ? `<p class="sub">Cartes révélées</p><div class="revealed">${req.revealCards.map(c => miniHTML(c.id, { attrs: `data-see="${c.id}"`, cls: req.options.some(o => o.value === c.uid) ? '' : 'dim' })).join('')}</div>` : '';
    const sub = multi ? `Choisissez ${req.min === req.max ? req.min : `de ${req.min} à ${req.max}`}.` : (req.min === 0 ? 'Facultatif.' : '');
    const sc = openSheet(`<h4>${esc(req.title)}</h4>${sub ? `<p class="sub">${sub}</p>` : ''}<div class="body">${reveal}${optHTML}</div>
      <div class="acts">${multi ? `<button class="btn primary" data-ok>Valider</button>` : ''}${req.min === 0 ? `<button class="btn ghost" data-skip>${multi ? 'Ne rien prendre' : 'Passer'}</button>` : ''}<button class="btn ghost small" data-peek>Voir le plateau</button></div>`, { modal: true });
    const okBtn = sc.querySelector('[data-ok]');
    const upd = () => { if (okBtn) { okBtn.disabled = sel.size < req.min || sel.size > req.max; okBtn.textContent = `Valider (${sel.size})`; } };
    upd();
    sc.querySelectorAll('[data-see]').forEach(b => b.onclick = () => toast(cardName(CARDS[b.dataset.see])));
    sc.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const o = req.options[+b.dataset.k];
      if (!multi) { closeSheet(); res([o.value]); return; }
      if (sel.has(o.value)) sel.delete(o.value); else if (sel.size < req.max) sel.add(o.value);
      b.classList.toggle('on', sel.has(o.value)); upd();
    });
    if (okBtn) okBtn.onclick = () => { closeSheet(); res([...sel]); };
    const sk = sc.querySelector('[data-skip]'); if (sk) sk.onclick = () => { closeSheet(); res([]); };
    sc.querySelector('[data-peek]').onclick = () => {
      // Important : tant qu'une question obligatoire attend une réponse, le menu ne doit
      // jamais supprimer sa fenêtre (sinon la Promise reste bloquée pour toujours).
      if (sc.dataset.peeking === '1') return;
      sc.dataset.peeking = '1';
      sc.style.display = 'none';
      const shield = document.createElement('div');
      shield.className = 'choice-peek-shield';
      shield.setAttribute('role','dialog');
      shield.setAttribute('aria-label','Consultation du plateau, choix en attente');
      shield.innerHTML = `<div class="peek-controls"><p>Choix en attente · les actions sont suspendues</p><button class="btn primary" id="returnToDecision">Revenir au choix</button></div>`;
      app.appendChild(shield);
      shield.querySelector('#returnToDecision').onclick = () => {
        shield.remove();
        sc.style.display = '';
        sc.dataset.peeking = '0';
        sc.querySelector('[data-peek]')?.focus({preventScroll:true});
      };
      shield.querySelector('#returnToDecision').focus({preventScroll:true});
    };
  });
}

function actionLabel(g, a) {

  switch (a.type) {
    case 'sell': return ['Vendre cette carte €$', '+1 Eddie permanent (seulement si la carte porte le symbole €$)'];
    case 'play': { const c = g.byUid(a.uid); const d = CARDS[c.id]; const cost = g.costOf(c, i); if (d.type === 'Gear') return [`Équiper sur ${g.name(g.byUid(a.host))}`, `${cost} €$`]; return [d.type === 'Program' ? 'Lancer ce programme' : 'Jouer cette unité', `${cost} €$${cost !== d.cost ? ` (coût imprimé ${d.cost})` : ''}`]; }

function arenaFX(kind){

async function startGame() {
  const D = allDecks();
  const mine = D[S.myDeck] || PRESETS['the-heist'];
  const theirs = S.aiDeck === 'random' ? randomAIDeck() : (D[S.aiDeck] || PRESETS['embracing-power']);
  const invalidPlayer = validateDeck(mine), invalidEnemy = validateDeck(theirs);
  if (invalidPlayer.length || invalidEnemy.length) {
    mount('<div class="screen"><div class="board"></div></div>');
    showDuelFailure(new Error(`Deck invalide : ${(invalidPlayer[0]||invalidEnemy[0])}`),null);
    return;
  }
  mount('<div class="screen"><div class="board"></div></div>');
  const boardSurface=app.querySelector('.board');
  boardSurface.addEventListener('click', boardClick);
  // A press-and-hold opens a read-only card sheet; a tap keeps its normal game actions.
  let pressTimer=null,pressX=0,pressY=0,suppressTapUntil=0;
  const cancelPress=()=>{if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}};
  boardSurface.addEventListener('pointerdown', e=>{
    if(e.pointerType!=='touch' || S.sheet)return;
    const tile=e.target.closest('[data-hand],[data-unit]');if(!tile)return;
    const uid=+(tile.dataset.hand||tile.dataset.unit);
    pressX=e.clientX;pressY=e.clientY;cancelPress();
    pressTimer=setTimeout(()=>{
      pressTimer=null;const inst=S.game?.byUid(uid);if(!inst)return;
      suppressTapUntil=Date.now()+900;showCard(inst.id,tile.dataset.unit?inst:null);
    },470);
  },{passive:true});
  boardSurface.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-pressX)>11||Math.abs(e.clientY-pressY)>11)cancelPress();},{passive:true});
  ['pointerup','pointercancel','pointerleave','scroll'].forEach(type=>boardSurface.addEventListener(type,cancelPress,{passive:true}));
  boardSurface.addEventListener('click',e=>{
    if(Date.now()<suppressTapUntil){e.preventDefault();e.stopImmediatePropagation();suppressTapUntil=0;}
  },true);
  boardSurface.addEventListener('click', e=>{
    if(e.target.closest('#retrySetup')) { e.preventDefault(); S.game=null;S.duelLearner=null;startGame(); }
  });
  S.ticker = 'Jet de d20 pour savoir qui commence…'; S.fx = {}; S.acts = []; S.resolveMain = null; S.thinking = false;
  const session=S.learningEnabled ? window.RivalLearning.begin(S.rivalMemory,mine,theirs) : null;
  S.duelLearner=session;
  let g;
  const hooks = {
    log(msg) { guard(g); S.ticker=msg; const el=app.querySelector('#ticker'); if(el) el.textContent=msg; else render(); },
    thinking(on) { if(S.game!==g)return; S.thinking=on; const el=app.querySelector('.side.rival .who small');
      if(el) el.innerHTML=on?'<span class="thinking">réfléchit<i>…</i></span>':LEVELS[S.level][0]; else render(); },
    async ui(ev, d) {
      guard(g);
      const ai = d.p === AI; const nm = x => esc(g.name(x));
      switch (ev) {
        case 'initialHands': case 'setupComplete': render(); break;
        case 'roll': S.fx.fresh = d.die.uid; render(); arenaFX('roll'); await sleep(170); S.fx.fresh = null; break;
        case 'steal': S.fx.stolen = d.die.uid; S.ticker='Gig transféré · '+(g.P(HUMAN).gigs.length)+' / 7 pour vous'; render(); arenaFX('steal'); await sleep(ai ? 600 * S.speed : 350); S.fx.stolen = null; break;
        case 'play': render(); arenaFX('play'); if (ai) await spotlight(d.c.id, `<b>L'IA</b> ${CARDS[d.c.id].type === 'Program' ? 'lance' : CARDS[d.c.id].type === 'Gear' ? `équipe ${d.host ? 'sur ' + nm(d.host) : ''}` : 'joue'} ${nm(d.c)}`, false, 1150); break;
        case 'call': render(); await spotlight(d.inst.id, `<b>${ai ? "L'IA" : 'Vous'}</b> ${ai ? 'appelle' : 'appelez'} ${nm(d.inst)}`, !ai, ai ? 1200 : 900); break;
        case 'attack': S.fx.att = d.u.uid; S.fx.tgt = d.target.kind === 'unit' ? d.target.uid : null; render(); arenaFX('attack'); if (ai) await spotlight(null, `<b>${nm(d.u)}</b> attaque ${d.target.kind === 'gigs' ? 'vos Gigs' : nm(g.byUid(d.target.uid))}`, false, 800); break;
        case 'block': S.fx.tgt = d.b.uid; render(); await spotlight(null, `<b>${nm(d.b)}</b> bloque l'attaque`, d.p === HUMAN, 700); break;
        case 'fight': render(); arenaFX('fight'); await sleep(160 * S.speed); break;
        case 'defeat': render(); arenaFX('defeat'); await sleep(90); break;
        case 'sell': render(); if (ai) await spotlight(null, "<b>L'IA</b> vend une carte (+1 €$)", false, 600); break;
        case 'ability': render(); if (ai) await spotlight(d.inst.id, `<b>L'IA</b> active ${nm(d.inst)}`, false, 1000); break;
        case 'peek': if (d.p === HUMAN) await spotlight(d.inst.id, `<b>Vous regardez</b> ${nm(d.inst)}`, true, 1800); break;
        case 'turn': S.fx = {}; render(); await spotlight(null, d.p === HUMAN ? '<b>À vous de jouer</b>' : "<b>Tour de l'IA</b>", d.p === HUMAN, 700); break;
      }
    },
  };
  const human=session?{...Human,
    async mainAction(g,i,acts){const a=await Human.mainAction(g,i,acts);window.RivalLearning.observeHuman(session,g,a);return a;},
    async react(g,i,A,acts){const a=await Human.react(g,i,A,acts);window.RivalLearning.observeHuman(session,g,a);return a;}
  }:Human;
  const baseAI=makeAI(S.level);

  const playerAI = S.level==='facile' ? baseAI : {
    ...baseAI,
    async mainAction(g,i,acts){
      g.hooks?.thinking?.(true);
      try {
        const offloaded=await TacticalWorker.decide('mainAction',g,i,acts);
        if(offloaded) return offloaded;
        return await FastPolicy.mainAction(g,i,acts);
      } finally {g.hooks?.thinking?.(false);}
    },
    async react(g,i,attack,acts){
      g.hooks?.thinking?.(true);
      try {
        const offloaded=await TacticalWorker.decide('react',g,i,acts,attack);
        if(offloaded) return offloaded;
        return await FastPolicy.react(g,i,attack,acts);
      } finally {g.hooks?.thinking?.(false);}
    }
  };
  const enemy=session?{...playerAI,
    async mainAction(g,i,acts){const a=await playerAI.mainAction(g,i,acts);window.RivalLearning.recordAI(session,g,i,a);return a;},
    async react(g,i,A,acts){const a=await playerAI.react(g,i,A,acts);window.RivalLearning.recordAI(session,g,i,a);return a;}
  }:playerAI;
  try {
    g = Game.create([mine, theirs], [human,enemy], { names: [S.pseudo, "L'IA"], hooks, ...(S.challengeActive&&S.challenge?{seed:S.challenge.seed}:{}) });
  } catch(e) { console.error(e); showDuelFailure(e,null); return; }
  S.game = g; render();
  let res;
  try { res = await g.run(); } catch (e) {
    if (e.message === 'abandon') return;
    console.error('[7 Gigs] Duel interrompu :',e);
    if (S.game === g) showDuelFailure(e,g);
    return;
  }
  if (S.game !== g) return;
  const completedMission=S.campaignMission;
  recordDuel(res,g,completedMission);
  recordChallenge(res,g);
  S.campaignMission=null;
  if(session){
    S.rivalMemory=window.RivalLearning.finish(S.rivalMemory,session,res.winner);
    if(!store.set('rivalLearningV1',S.rivalMemory))toast('Mémoire non sauvegardée sur cet appareil : export nécessaire.',4000);
    S.duelLearner=null;
  }
  S.resolveMain = null; S.acts = []; render(); closeSheet();
  const win = res.winner === HUMAN;
  const ov = document.createElement('div'); ov.className = 'over';
  ov.innerHTML = `<h1 class="${win ? 'win' : 'lose'}">${win ? 'Victoire' : res.winner === -1 ? 'Égalité' : 'Défaite'}</h1><p>${esc(res.reason)}</p>${session?`<p style="max-width:340px;color:var(--sodium);font-size:.83rem">◈ Duel mémorisé. Plan testé : ${esc(window.RivalLearning.STRATEGIES[session.variant].name)}. ${esc(rivalDeckText())}</p>`:''}<button class="btn primary" id="again">Rejouer</button><button class="btn ghost" id="log2">Voir le journal</button><button class="btn ghost" data-nav="stats">Statistiques</button><button class="btn ghost" data-nav="campaign">Campagne</button><button class="btn ghost" data-nav="challenge">Défi local</button><button class="btn ghost" data-nav="home">Menu principal</button>`;
  app.appendChild(ov);
  ov.querySelector('#again').onclick = () => startGame();
  ov.querySelector('#log2').onclick = () => { ov.remove(); logSheet(); const b = document.createElement('button'); b.className = 'btn primary'; b.style.cssText = 'position:absolute;right:10px;top:10px;z-index:60'; b.textContent = 'Menu'; b.dataset.nav = 'home'; app.appendChild(b); };
}

'use strict';
/* Collection-aware deck advisor. Deterministic suggestions; no invented cards
 * or pretend ownership. Official legality is delegated to validateDeck.
 * This block is also embedded verbatim in prime_v220_runtime.html for APK.
 */
(function(root){
  const qty=v=>Number.isFinite(Number(v))?Math.max(0,Math.min(99,Math.floor(Number(v)))):0;
  const count=list=>(list||[]).reduce((out,id)=>(out[id]=(out[id]||0)+1,out),{});
  const clean=(raw,cards)=>Object.fromEntries(Object.entries(raw||{}).filter(([id])=>Object.prototype.hasOwnProperty.call(cards,id)).map(([id,n])=>[id,qty(n)]).filter(([,n])=>n>0));
  const safe=(d,legends,limits)=>d.type!=='Legend'&&limits[d.color]>0&&(d.ram||0)<=limits[d.color];
  const normal=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  function importText(raw,cards,previous={}){
    const result={...clean(previous,cards)},errors=[];
    const index=new Map();
    for(const d of Object.values(cards)){
      for(const v of [d.id,d.name,d.nameEn,[d.name,d.sub].filter(Boolean).join(' '),[d.nameEn,d.subEn].filter(Boolean).join(' ')]){
        if(v&&!index.has(normal(v)))index.set(normal(v),d.id);
      }
    }
    let parsed=0;
    for(const line of String(raw).split(/[\r\n;]+/).map(x=>x.trim()).filter(Boolean)){
      let name=line,amount=1;
      const prefix=line.match(/^(\d{1,2})\s*[x×*]\s*(.+)$/i);
      const suffix=!prefix&&line.match(/^(.+?)\s*[x×*]\s*(\d{1,2})$/i);
      if(prefix){amount=prefix[1];name=prefix[2];}
      else if(suffix){name=suffix[1];amount=suffix[2];}
      const id=index.get(normal(name));
      if(!id){errors.push(line);continue;}
      const n=qty(amount);
      if(!n){errors.push(line);continue;}
      result[id]=Math.min(99,(result[id]||0)+n);parsed+=n;
    }
    return {owned:result,errors,parsed};
  }
  function similarity(d,legends,template,cardSet){
    const counts=count(template.main),legTags=new Set(legends.flatMap(id=>cardSet[id]?.tags||[]));
    const t=Object.keys(counts).map(id=>cardSet[id]).filter(Boolean);
    const tags=new Set(t.flatMap(x=>x.tags||[]));
    let score=(counts[d.id]||0)*5;
    score+=(d.tags||[]).filter(x=>legTags.has(x)).length*1.3;
    score+=(d.tags||[]).filter(x=>tags.has(x)).length*.25;
    score+=d.sell?1.4:0;
    score+=d.type==='Unit'?1.3:d.type==='Gear'?.45:.65;
    score+=(d.cost??0)<=4?1.3:(d.cost??0)>=7?-1:0;
    score+=(d.kw||[]).includes('BLOCKER')?.7:0;
    return score;
  }
  function ownedDeck(legends,template,owned,cards,limitsFn,validate){
    const missingLegends=legends.filter(id=>!owned[id]);
    const lim=limitsFn(legends);
    const pool=Object.values(cards).filter(d=>safe(d,legends,lim)&&owned[d.id]>0)
      .map(d=>({d,available:Math.min(3,owned[d.id]),value:similarity(d,legends,template,cards)}));
    const main=[],used={},types={Unit:0,Gear:0,Program:0};
    while(main.length<40){
      const candidates=pool.filter(x=>(used[x.d.id]||0)<x.available);
      if(!candidates.length)break;
      const picked=candidates.map(x=>{
        const bonus={Unit:Math.max(-6,(23-types.Unit)*.2),Gear:Math.max(-5,(8-types.Gear)*.27),Program:Math.max(-5,(9-types.Program)*.26)}[x.d.type]||0;
        const repeat=(used[x.d.id]||0)*.45;
        return {...x,score:x.value+bonus-repeat};
      }).sort((a,b)=>b.score-a.score||a.d.id.localeCompare(b.d.id))[0];
      main.push(picked.d.id);used[picked.d.id]=(used[picked.d.id]||0)+1;types[picked.d.type]++;
    }
    const deck={name:'Collection · '+template.name,legends:legends.slice(),main};
    return {deck,used,missingLegends,needMain:Math.max(0,40-main.length),
      playable:!missingLegends.length&&validate(deck).length===0};
  }
  function suggest(raw,cards,templates,validate,limitsFn){
    const owned=clean(raw,cards),presets=Object.entries(templates)
      .filter(([,d])=>d&&Array.isArray(d.legends)&&Array.isArray(d.main)&&!validate(d).length);
    const ranked=presets.map(([id,deck])=>{
      const wanted=count(deck.main),missingMain=Object.entries(wanted).map(([cardId,n])=>({
        id:cardId,count:Math.max(0,n-Math.min(3,owned[cardId]||0))
      })).filter(x=>x.count>0);
      const missingLegends=deck.legends.filter(l=>!(owned[l]>0));
      const haveMain=deck.main.length-missingMain.reduce((n,x)=>n+x.count,0);
      const haveLegends=3-missingLegends.length;
      const own=ownedDeck(deck.legends,deck,owned,cards,limitsFn,validate);
      return {id,name:deck.name,deck,haveMain,haveLegends,missingMain,missingLegends,
        coverage:Math.round(100*(haveMain+haveLegends)/(deck.main.length+3)),
        missingCopies:missingMain.reduce((n,x)=>n+x.count,0)+missingLegends.length,
        playableAlternative:own};
    }).sort((a,b)=>a.missingCopies-b.missingCopies||b.haveMain-a.haveMain||a.id.localeCompare(b.id));
    let ownedBest=null;
    const legends=Object.values(cards).filter(c=>c.type==='Legend'&&owned[c.id]>0);
    const sets=[];
    // Bound combinatorics even for an almost complete 150-card collection.
    for(let i=0;i<legends.length&&sets.length<160;i++)
      for(let j=i+1;j<legends.length&&sets.length<160;j++)
        for(let k=j+1;k<legends.length&&sets.length<160;k++){
          const trio=[legends[i],legends[j],legends[k]];
          if(new Set(trio.map(x=>x.name)).size===3)sets.push(trio.map(x=>x.id));
        }
    for(const lg of sets)for(const target of ranked.slice(0,12)){
      const proposed=ownedDeck(lg,target.deck,owned,cards,limitsFn,validate);
      const score=proposed.deck.main.length*100+
        proposed.deck.main.reduce((v,id)=>v+(count(target.deck.main)[id]?2:0),0);
      if(!ownedBest||score>ownedBest.score)ownedBest={...proposed,score,basedOn:target.name};
    }
    return {owned,ranked,closest:ranked[0]||null,ownedBest,
      totalCopies:Object.values(owned).reduce((a,n)=>a+n,0),
      unique:Object.keys(owned).length};
  }

  // High-confidence engine-mechanic pairs, not card-certification claims.
  const PAIRS=[
    {a:'netwatch-netdriver',b:'tetratronic-rippler',why:'Épuiser un même hôte permet de piocher, puis éventuellement de défausser la carte du dessus.'},
    {a:'goro-takemura-vengeful-bodyguard',b:'corpo-security',why:'Goro renforce les options BLOQUEUR ; Corpo Security protège vos Gigs.'},
    {a:'evelyn-parker-beautiful-enigma',b:'animals-wrecker',why:'Un GANGER qui vole des Gigs peut déclencher le redressement d’un Eddie avec Evelyn.'},
    {a:'jackie-welles-pour-one-out-for-me',b:'delamain-cab',why:'Une première unité bleue déclenche l’ajustement de Gig de Jackie et une pioche conditionnelle.'},
    {a:'yorinobu-arasaka-steel-dragon',b:'field-operator',why:'Yorinobu peut jouer gratuitement une unité ARASAKA de coût admissible.'},
    {a:'dying-night-v-s-pistol',b:'v-corporate-exile',why:'Équiper V avec Dying Night permet de redresser des Eddies en fin de tour.'}
  ];
  function synergies(owned,cards,deck){
    const ids=new Set([...(deck?.main||[]),...(deck?.legends||[])]);
    return PAIRS.filter(x=>cards[x.a]&&cards[x.b]&&
      ((owned[x.a]||0)>0||(owned[x.b]||0)>0))
      .map(x=>{
        const missing=[x.a,x.b].filter(id=>!(owned[id]>0));
        const bothInDeck=ids.has(x.a)&&ids.has(x.b);
        return {...x,missing,bothInDeck,ready:missing.length===0};
      }).sort((a,b)=>Number(b.bothInDeck)-Number(a.bothInDeck)||
        a.missing.length-b.missing.length||a.a.localeCompare(b.a));
  }
  const api={clean,importText,suggest,ownedDeck,synergies};
  root.CollectionAdvisor=api;
  if(typeof module!=='undefined')module.exports=api;
})(typeof window!=='undefined'?window:globalThis);

function builderScreen(draft) {
  const B={draft:{...draft,legends:(draft.legends||[]).slice(),main:(draft.main||[]).slice()},q:'',color:'',type:'',tab:'pool'};
  const legendsAll=Object.values(CARDS).filter(c=>c.type==='Legend');
  const allowed=()=>{const lim=deckRamLimits(B.draft.legends);return Object.values(CARDS).filter(d=>d.type!=='Legend'&&lim[d.color]>0&&(d.ram||0)<=lim[d.color]);};
  const count=()=>B.draft.main.reduce((a,id)=>(a[id]=(a[id]||0)+1,a),{});
  function change(id, delta) {
    const d=B.draft, n=d.main.filter(x=>x===id).length;
    if(delta>0){if(n>=3||d.main.length>=50)return toast('Limite de 3 copies ou 50 cartes');d.main.push(id);}
    else{const p=d.main.indexOf(id);if(p<0)return;d.main.splice(p,1);}
    const y=app.querySelector('.scroll')?.scrollTop||0;
    draw();if(app.querySelector('.scroll'))app.querySelector('.scroll').scrollTop=y;
  }
  function draw(){
    const d=B.draft, lim=deckRamLimits(d.legends),cnt=count(),errs=validateDeck(d);
    let pool=allowed();if(B.color)pool=pool.filter(x=>x.color===B.color);if(B.type)pool=pool.filter(x=>x.type===B.type);
    if(B.q)pool=pool.filter(x=>searchable(x).includes(B.q.toLowerCase()));
    pool.sort((a,b)=>(a.cost??0)-(b.cost??0)||a.name.localeCompare(b.name));
    const selected=Object.entries(cnt).sort((a,b)=>(CARDS[a[0]]?.cost??0)-(CARDS[b[0]]?.cost??0));
    const typeCnt={Unit:0,Gear:0,Program:0};const curve=[0,0,0,0];const sellCount=d.main.filter(id=>CARDS[id]?.sell === true).length;
    d.main.forEach(id=>{const x=CARDS[id];if(!x)return;typeCnt[x.type]++;const c=x.cost??0;curve[c<=2?0:c<=4?1:c<=6?2:3]++;});
    const curveMax=Math.max(1,...curve);
    mount(`<div class="screen">${topbar('Éditeur de deck','decks')}<div class="scroll sim-builder">
      <div class="sim-build-header"><input class="search sim-build-name" id="deckName" value="${esc(d.name)}" maxlength="40" aria-label="Nom du deck">
        <div class="sim-legend-row">${[0,1,2].map(slot=>{const id=d.legends[slot],x=CARDS[id];return `<button class="sim-legbox ${x?'fc-'+x.color:''}" data-slot="${slot}">${x?`<b>${esc(x.name)}</b><small>${esc(x.sub||'Changer')}</small>`:`<b>+ Légende ${slot+1}</b><small>Choisir</small>`}</button>`}).join('')}</div>
        <div class="ram">${COLORS.filter(c=>lim[c]).map(c=>`<span><i class="dot fc-${c}"></i> ${COLOR_FR[c]} RAM ${lim[c]}</span>`).join('')||'Sélectionnez vos trois Légendes.'}</div>

      </div>
      <div class="sim-builder-tabs"><button id="tabPool" class="${B.tab==='pool'?'on':''}">Catalogue</button><button id="tabDeck" class="${B.tab==='deck'?'on':''}">Mon deck (${d.main.length})</button></div>
      <div class="sim-build-columns" data-view="${B.tab}"><div class="sim-pool-panel"><div class="sim-panel-title">Catalogue disponible <span>${pool.length} cartes</span></div>

          <select class="sim-select" id="bc"><option value="">Toutes couleurs</option>${COLORS.filter(c=>lim[c]).map(c=>`<option value="${c}" ${B.color===c?'selected':''}>${COLOR_FR[c]}</option>`).join('')}</select>
          <select class="sim-select" id="bt"><option value="">Tous types</option>${['Unit','Gear','Program'].map(t=>`<option value="${t}" ${B.type===t?'selected':''}>${TYPE_FR[t]}</option>`).join('')}</select></div>
        <div class="sim-pool-grid">${pool.map(c=>`<div class="sim-pool-entry">
          ${miniHTML(c.id,{attrs:`data-inspect="${c.id}"`})}
          <span class="sim-entry-name">${esc(cardName(c))}</span>

      </div><aside class="sim-my-deck"><div class="sim-panel-title">Mon deck <span>${d.main.length} cartes</span></div>

    app.querySelector('#tabPool').onclick=()=>{B.tab='pool';draw();};
    app.querySelector('#tabDeck').onclick=()=>{B.tab='deck';draw();};
    app.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>pickLegend(+b.dataset.slot));
    app.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>change(b.dataset.plus,1));

    app.querySelector('#bc').onchange=e=>{B.color=e.target.value;draw();};
    app.querySelector('#bt').onchange=e=>{B.type=e.target.value;draw();};
    const input=app.querySelector('#bq');input.oninput=()=>{B.q=input.value;clearTimeout(B.tm);B.tm=setTimeout(()=>{draw();const n=app.querySelector('#bq');n.focus();n.setSelectionRange(n.value.length,n.value.length);},230);};
    app.querySelector('#fillDeck').onclick=()=>{
      const usable=allowed(), keep=d.main.filter(id=>usable.some(x=>x.id===id));
      const rest=autoDeck(d.legends,Math.random,Math.max(40,keep.length));

      a.href=url;a.download='7gigs-'+d.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);

    app.querySelector('#cache-art').onclick=async e=>{
      const b=e.currentTarget;b.disabled=true;
      const r=await ArtCache.installAll((done,total)=>{if(b.isConnected)b.textContent=`Images ${done}/${total}`;});
      toast(`${r.ok} images enregistrées, ${r.failed} échecs.`,4000);if(S.onPhoto)S.onPhoto();
    };
  }
  draw();
}

// ========================================================== MODE SCAN =====
function scanSetup(visibleIds) {
  const byNum = ids => ids.slice().sort((a, b) => (numOf(a) ?? 999) - (numOf(b) ?? 999));
  const all = byNum(Object.keys(CARDS)), missing = all.filter(id => !IMG[id]);
  const vis = byNum(visibleIds);
  const sc = openSheet(`<h4>Mode scan</h4><p class="sub">L'appli vous présente les cartes une par une, dans l'ordre du set. Prenez chaque carte en photo, bien à plat et cadrée ; vous pouvez passer celles que vous n'avez pas.</p>
    <div class="acts"><button class="btn primary" data-set="missing" ${missing.length ? '' : 'disabled'}>Cartes sans photo (${missing.length})</button><button class="btn" data-set="vis">Cartes affichées (${vis.length})</button><button class="btn ghost" data-set="all">Les ${all.length} cartes</button><button class="btn ghost" data-close>Annuler</button></div>`);
  sc.querySelector('[data-close]').onclick = closeSheet;
  sc.querySelectorAll('[data-set]').forEach(b => b.onclick = () => { closeSheet(); scanScreen(b.dataset.set === 'missing' ? missing : b.dataset.set === 'vis' ? vis : all); });
}
function scanScreen(list, k = 0) {
  if (!list.length) return cardsScreen();
  let i = Math.max(0, Math.min(k, list.length - 1)); let done = 0;
  const draw = () => {
    const id = list[i], d = CARDS[id], n = numOf(id);
    mount(`<div class="screen scan">${topbar('Mode scan', 'cards')}<div class="scroll pad">
      <div class="scanhead"><span>${i + 1} / ${list.length}</span><span>${done} photo${done > 1 ? 's' : ''} ajoutée${done > 1 ? 's' : ''}</span></div>
      <div class="scanbar"><i style="width:${((i + 1) / list.length) * 100}%"></i></div>
      <p class="scannum">${n ? 'N° ' + String(n).padStart(3, '0') : 'Deck de démarrage'}, ${TYPE_FR[d.type].toLowerCase()} ${COLOR_FR[d.color].toLowerCase()}</p>
      <h1 class="scanname fc-${d.color}">${esc(d.name)}</h1>${d.sub ? `<p class="scansub">${esc(d.sub)}</p>` : ''}<p class="scanvo">${esc(cardNameEn(d))}</p>
      <div class="scanframe">${IMG[id] ? `<img src="${IMG[id]}" alt="Votre photo de ${esc(cardName(d))}">` : `<div class="scanempty"><span>Cadrez la carte entière, sans reflet</span></div>`}</div>
      </div><div class="actionbar scanbtns"><button class="btn ghost small" id="prev" ${i ? '' : 'disabled'}>Précédente</button><button class="btn primary" id="shot" style="flex:1">${IMG[id] ? 'Reprendre la photo' : 'Prendre la photo'}</button><button class="btn ghost small" id="skip">${i < list.length - 1 ? 'Passer' : 'Terminer'}</button></div></div>`);
    app.querySelector('#prev').onclick = () => { i--; draw(); };
    app.querySelector('#skip').onclick = () => { if (i < list.length - 1) { i++; draw(); } else { toast(`${done} photo(s) ajoutée(s)`); cardsScreen(); } };
    app.querySelector('#shot').onclick = async () => {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment'); inp.style.display = 'none';
      inp.onchange = async () => { const f = inp.files[0]; inp.remove(); if (!f) return; try { await Photos.put(id, await shrink(f)); done++; if (i < list.length - 1) { toast('Enregistrée', 900); i++; } draw(); } catch (e) { toast('Cette image ne peut pas être lue'); } };
      app.appendChild(inp); inp.click();
    };
  };
  draw();
}

// ============================================================ RÈGLES ======
const RULES_HTML = `
<h3>Résumé des attaques et des Gigs</h3>
<p>Pour attaquer, utilisez une <strong>Unité prête</strong> et non affectée par la <strong>Latence</strong>, puis choisissez une <strong>Unité rivale dépensée</strong> ou la <strong>zone des Gigs ennemie non vide</strong>. L’unité attaquante est dépensée. Le défenseur peut réagir : Programme RAPIDE, Appel de Légende, BLOQUEUR ou capacité disponible. Les capacités de cartes peuvent créer des exceptions.</p>
<p>Une attaque contre la zone des Gigs permet de voler <strong>1 Gig de puissance 1 à 9</strong>, <strong>2 de 10 à 19</strong>, <strong>3 de 20 à 29</strong>, etc. Le vol peut être empêché ou modifié par des effets. Les Gigs sélectionnés et non empêchés changent de camp simultanément.</p>
<p><strong>Victoire :</strong> contrôlez au moins 7 Gigs au début de votre tour, ou à tout moment pendant la prolongation. Piocher dans un deck vide fait perdre immédiatement. Les valeurs des dés participent au Street Cred.</p>
<h3>But du jeu</h3>
<p>Chaque joueur possède 6 dés de Gig (d4, d6, d8, d10, d12, d20). <strong>Commencez votre tour avec 7 Gigs ou plus dans votre zone de Gigs et vous gagnez.</strong> Comme chacun n'a que 6 dés, il faut en voler à l'adversaire. Chaque dé compte pour un Gig, quelle que soit sa valeur. La somme des valeurs de vos Gigs est votre <strong>Street Cred (☆)</strong>, utilisée par de nombreuses cartes.</p>
<p><strong>Prolongation :</strong> quand les deux joueurs ont commencé deux tours de suite avec leur zone Fixer vide (en général après le 7e tour de chacun), le premier à contrôler 7 Gigs gagne immédiatement. Si vous devez piocher dans un deck vide, vous perdez.</p>
<h3>Mise en place</h3>
<ul><li>Chaque joueur mélange son deck et place ses 3 Légendes face cachée, dans un ordre aléatoire que même lui ignore.</li>
<li>Jet de d20 : le gagnant choisit qui commence. Le premier joueur épuise ses 2 Légendes de gauche, qui ne se redressent pas à son premier tour.</li>
<li>Piochez 6 cartes. Vous pouvez faire un mulligan une seule fois.</li></ul>
<h3>Déroulement d'un tour</h3>
<p><strong>Début du tour</strong>, dans l'ordre : vérification de la victoire, effets de début de tour, redressement de vos cartes, pioche d'une carte, puis lancement d'un dé de votre zone Fixer vers votre zone de Gigs (le d20 est toujours lancé en dernier).</p>
<p><strong>Phase principale</strong>, dans l'ordre de votre choix :</p>
<ul><li><strong>Vendre</strong> (une fois par tour) : seule une carte portant le logo <strong>€$ / Sell Tag</strong> peut être vendue depuis votre main. L'Eddie créé entre face cachée et prête ; un effet de carte peut vendre sans logo et ne consomme pas votre vente du tour.</li>
<li><strong>Jouer une carte</strong> en payant son coût. On paie avec des Eddies ou des Légendes (1 €$ chacune) : face cachée toujours ; face visible seulement avec le symbole €$.</li>
<li><strong>Appeler une Légende</strong> (une fois par tour, 1 €$) : retournez au hasard une de vos Légendes face cachée. Ses capacités deviennent actives. Vous pouvez aussi appeler pendant le tour adverse, en réaction à une attaque.</li>
<li><strong>Activer une capacité</strong> : le symbole <span class="kw spend">⟳</span> signifie épuiser la carte.</li>
<li><strong>Attaquer</strong> avec une unité prête.</li></ul>
<h3>Types de cartes</h3>
<ul><li><strong>Légendes</strong> : 3 par deck, elles restent dans la zone de Légendes. Celles qui ont <span class="kw">EN SOLO</span> peuvent entrer sur le terrain comme unité prête qui attaque tout de suite (en payant leur coût). Une Légende qui quitte le terrain est retirée du jeu.</li>
<li><strong>Unités</strong> : elles arrivent prêtes mais avec <strong>Latence</strong> : pas d'attaque ni de capacité <span class="kw spend">⟳</span> le tour où elles sont jouées, sauf avec <span class="kw">ADRÉNALINE</span>.</li>
<li><strong>Équipements</strong> : attachés à une unité ou une Légende face visible. Ils ajoutent leur puissance et leurs capacités, et partent au rebut avec leur porteur.</li>
<li><strong>Programmes</strong> : effet immédiat, puis rebut. Ceux qui ont <span class="kw">RAPIDE</span> se jouent aussi en réaction à une attaque adverse.</li></ul>
<h3>Attaquer</h3>
<p>Épuisez une unité prête et choisissez une cible : <strong>une unité adverse épuisée</strong> (les unités prêtes ne peuvent pas être attaquées) ou <strong>la zone de Gigs adverse</strong>. Le défenseur peut alors réagir : appeler une Légende, jouer des effets <span class="kw">RAPIDE</span>, ou épuiser une unité <span class="kw">BLOQUEUR</span> prête pour détourner l'attaque sur elle.</p>
<ul><li><strong>Combat</strong> : la plus grande puissance gagne et l'autre est vaincue. En cas d'égalité, les deux sont vaincues. Une unité à 0 de puissance ne peut vaincre personne.</li>
<li><strong>Vol</strong> : l'attaquant prend des Gigs adverses de son choix : 1 Gig de 1 à 9 de puissance, 2 de 10 à 19, 3 de 20 à 29… Une unité à 0 ne vole rien. Une attaque bloquée ne vole jamais de Gig.</li></ul>
<h3>Construire un deck</h3>
<ul><li>Exactement 3 Légendes aux noms différents, et 40 à 50 autres cartes, 3 exemplaires maximum.</li>
<li>Chaque Légende a une RAM (2) dans sa couleur. Une carte n'est autorisée que si sa RAM ne dépasse pas le total de RAM de vos Légendes dans sa couleur. Exemple : 2 Légendes vertes et 1 rouge autorisent les cartes vertes jusqu'à RAM 4 et les rouges jusqu'à RAM 2.</li></ul>

<li><strong>Mettre au rebut N</strong> : placez les N cartes du dessus de votre deck dans votre rebut. <strong>Placer sous le deck</strong> : sous le deck de son propriétaire.</li></ul>
<h3>À propos de ce simulateur</h3>
<p>Les 150 cartes jouables du set <em>Welcome to Night City</em> et des deux decks de démarrage sont implémentées d'après les règles complètes publiées par WeirdCo. Les noms des cartes sont les noms officiels de la version française (sauf 7 exclusivités des decks de démarrage, traduites ici) ; le nom anglais est rappelé sur chaque carte. Les textes de règles sont des traductions libres. Les illustrations officielles ne sont pas incluses : chaque carte a un lien vers sa page officielle, et vous pouvez ajouter vos propres photos de cartes depuis « Les 150 cartes ». Elles restent sur votre appareil. La carte promo sans texte Rebecca n'est pas incluse. Seules les cartes portant le symbole €$ peuvent être vendues normalement. Les Légendes face visible participent aux paiements selon les règles spécifiques des Légendes. En cas de doute sur un texte, l'interprétation la plus directe a été retenue.</p>`;
function rulesScreen() { mount(`<div class="screen">${topbar('Règles du jeu')}<div class="scroll rules">${RULES_HTML}</div></div>`); }

homeScreen();
Promise.all([Photos.loadAll(), ArtCache.loadAll(), FrenchArt.loadAll()]).then(() => {
