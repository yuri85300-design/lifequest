name: 7 Gigs PRIME - current official card catalogue
on:
  push:
    paths:
      - 'native/engine.js'
      - 'native/official_card_audit.cjs'
      - 'native/semantic_oracles.cjs'
      - 'native/semantic_oracles_extra.cjs'
      - 'native/semantic_oracles_interactions.cjs'
      - 'native/semantic_oracles_programs.cjs'
      - 'native/semantic_oracles_advanced.cjs'
      - 'native/semantic_oracles_advanced2.cjs'
      - 'native/semantic_oracles_complex_one.cjs'
      - 'native/semantic_oracles_last_a.cjs'
      - 'native/semantic_oracles_last_b.cjs'
      - 'native/semantic_oracles_branches.cjs'
      - 'native/semantic_oracles_quick_contracts.cjs'
      - 'native/semantic_oracles_relic_contracts.cjs'
      - 'native/semantic_oracles_cross_card.cjs'
      - 'native/semantic_oracles_radioport.cjs'
      - 'native/semantic_oracles_evelyn.cjs'
      - 'native/semantic_oracles_jackie.cjs'
      - 'native/semantic_oracles_faceplate.cjs'
      - 'native/semantic_oracles_negotiators.cjs'
      - 'native/semantic_oracles_minotaur.cjs'
      - 'native/semantic_oracles_meredith.cjs'
      - 'native/semantic_oracles_goro.cjs'
      - 'native/semantic_oracles_valentino.cjs'
      - 'native/semantic_oracles_cyberware_timing.cjs'
      - 'native/semantic_oracles_core_conditions.cjs'
      - 'native/semantic_oracles_trigger_conditions.cjs'
      - 'native/semantic_oracles_high_risk_replacements.cjs'
      - 'native/semantic_oracles_timing_reactions.cjs'
      - 'native/semantic_oracles_yorinobu_dragon.cjs'
      - 'native/semantic_oracles_gilded_maton.cjs'
      - 'native/semantic_oracles_high_risk_choices.cjs'
      - 'native/semantic_oracles_lizzy_program.cjs'
      - 'native/official_independent_oracles.cjs'
      - 'native/nocturne_official_oracles.cjs'
      - 'native/official_clause_witnesses.cjs'
      - 'native/semantic_oracle_runner.cjs'
      - 'native/card_lifecycle_oracles.cjs'
      - 'native/semantic_register.cjs'
      - 'native/semantic_gap_matrix.cjs'
      - 'native/semantic_gap_matrix_contract.cjs'
      - 'native/nightmare_training_browser_smoke.cjs'
      - 'native/prime_v220_runtime.html'
      - '.github/workflows/official-cards.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/official-cards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify semantic matrix fail-closed contract
        run: node native/semantic_gap_matrix_contract.cjs
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Smoke test NIGHTMARE sandbox training in Chromium
        run: node native/nightmare_training_browser_smoke.cjs
      - name: Inspect published English official card metadata
        id: audit
        continue-on-error: true
        run: node native/official_card_audit.cjs
      - name: Run independent semantic oracle suite
        if: always()
        run: node native/semantic_oracle_runner.cjs
      - name: Verify 150 card lifecycle scenarios alongside official texts
        if: always()
        run: node native/card_lifecycle_oracles.cjs
      - name: Generate 150-card semantic evidence ledger
        if: always()
        run: node native/semantic_register.cjs
      - name: Build prioritized unresolved official segment review matrix
        if: always() && steps.audit.outcome == 'success'
        run: node native/semantic_gap_matrix.cjs
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime-official-card-comparison
          path: audit-results/
          if-no-files-found: warn
      - name: Fail when any card cannot be verified
        if: steps.audit.outcome != 'success'
        run: |
          echo "Official metadata comparison not complete; never certify on incomplete data."
          exit 1
