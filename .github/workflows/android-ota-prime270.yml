name: PRIME 2.7.0 - Mise a jour interne et offline QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-ota-prime270.yml'
  workflow_run:
    workflows: ["7 Gigs PRIME 2.5.4 - OTA Bootstrap APK"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Telecharger l APK PRIME 2.5.4 existant depuis GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prime254-apk /tmp/prime270-proof
          curl --fail --location --retry 3 --retry-delay 3 --output /tmp/prime254-apk/7Gigs-PRIME-2.5.4.apk \
            https://github.com/yuri85300-design/lifequest/releases/download/prime-v2.5.4/7Gigs-PRIME-2.5.4.apk
          test -s /tmp/prime254-apk/7Gigs-PRIME-2.5.4.apk
          curl --fail --location --retry 3 --output /tmp/prime270-proof/latest.json \
            https://raw.githubusercontent.com/yuri85300-design/lifequest/main/updates/latest.json?qa=27000
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/prime270-proof/latest.json'))
          assert j['version_code']==27000 and j['min_shell']==25004,j
          print('PRIME_270_MANIFEST_PASS')
          PY
      - name: Check APK includes 150 French card image assets and correct package name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prime270-proof
          python3 - <<'PY'
          from zipfile import ZipFile
          p='/tmp/prime254-apk/7Gigs-PRIME-2.5.4.apk'
          with ZipFile(p) as z:
              art=[x for x in z.namelist() if x.startswith('assets/www/images_vf/')]
              assert len(art)==150,len(art)
              assert z.testzip() is None
              assert 'classes.dex' in z.namelist()
              print('APK OFFLINE ASSETS PASS 150/150')
          PY
          sha256sum /tmp/prime254-apk/7Gigs-PRIME-2.5.4.apk | tee /tmp/prime270-proof/apk-sha256.txt
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 test of version upgrade without reinstalling APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -e
            adb install -r /tmp/prime254-apk/7Gigs-PRIME-2.5.4.apk
            adb shell svc wifi enable
            adb shell svc data enable
            sleep 22
            adb logcat -c
            adb shell am start -W -n dev.septgigs.neonarena.prime254/dev.septgigs.neonarena.prime.PrimeUpdater254Activity --ez otaQa true | tee /tmp/prime270-proof/launch.txt
            sh -c 'n=0; while [ "$n" -lt 24 ]; do adb logcat -d > /tmp/prime270-proof/logcat-ota.txt; if grep -q PRIME_OTA_QA_FAIL /tmp/prime270-proof/logcat-ota.txt; then exit 1; fi; if grep -q PRIME_OTA_QA_PASS:27000 /tmp/prime270-proof/logcat-ota.txt; then exit 0; fi; n=$((n+1)); sleep 5; done; exit 2'
            grep -q 'PRIME_OTA_QA_PASS:27000' /tmp/prime270-proof/logcat-ota.txt
            sh -c 'n=0; while [ "$n" -lt 30 ]; do adb logcat -d > /tmp/prime270-proof/logcat-after-upgrade.txt; if grep -q OFFLINE_FR_QA_FAIL /tmp/prime270-proof/logcat-after-upgrade.txt; then exit 1; fi; if grep -q OTA_LOCAL_SAVE_QA_PASS /tmp/prime270-proof/logcat-after-upgrade.txt && grep -q OFFLINE_FR_QA_PASS:150/150: /tmp/prime270-proof/logcat-after-upgrade.txt; then exit 0; fi; n=$((n+1)); sleep 5; done; exit 2'
            grep -q 'OTA_LOCAL_SAVE_QA_PASS' /tmp/prime270-proof/logcat-after-upgrade.txt
            grep -q 'OFFLINE_FR_QA_PASS:150/150:' /tmp/prime270-proof/logcat-after-upgrade.txt
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am force-stop dev.septgigs.neonarena.prime254
            adb logcat -c
            adb shell am start -W -n dev.septgigs.neonarena.prime254/dev.septgigs.neonarena.prime.PrimeUpdater254Activity --ez offlineQa true | tee /tmp/prime270-proof/offline-start.txt
            sh -c 'n=0; while [ "$n" -lt 30 ]; do adb logcat -d > /tmp/prime270-proof/logcat-offline.txt; if grep -q OFFLINE_FR_QA_FAIL /tmp/prime270-proof/logcat-offline.txt; then exit 1; fi; if grep -q ACTIVE_PRIME_CONTENT=27000 /tmp/prime270-proof/logcat-offline.txt && grep -q OFFLINE_FR_QA_PASS:150/150: /tmp/prime270-proof/logcat-offline.txt; then exit 0; fi; n=$((n+1)); sleep 5; done; exit 2'
            grep -q 'ACTIVE_PRIME_CONTENT=27000' /tmp/prime270-proof/logcat-offline.txt
            grep -q 'OFFLINE_FR_QA_PASS:150/150:' /tmp/prime270-proof/logcat-offline.txt
            ! grep -q 'FATAL EXCEPTION' /tmp/prime270-proof/logcat-offline.txt
            # Dismiss Android's first-use immersive hint (it is not part of PRIME).
            adb shell input tap 915 657
            sleep 3
            adb shell uiautomator dump /sdcard/pre-visual.xml
            adb pull /sdcard/pre-visual.xml /tmp/prime270-proof/pre-visual.xml
            # Emulator system launcher occasionally ANRs independently of PRIME.
            # Do not call a screenshot successful while that modal covers the app.
            if grep -q "Pixel Launcher isn" /tmp/prime270-proof/pre-visual.xml; then
              adb shell input tap 450 1200
              sleep 4
            fi
            adb shell uiautomator dump /sdcard/prime270-ui.xml
            adb pull /sdcard/prime270-ui.xml /tmp/prime270-proof/ui-accessibility.xml
            ! grep -qi "isn.*responding" /tmp/prime270-proof/ui-accessibility.xml
            adb shell screencap -p /sdcard/prime270-home.png
            adb pull /sdcard/prime270-home.png /tmp/prime270-proof/after-update-offline.png
            # Navigate to actual Decks view, not just take a second home capture.
            adb shell input tap 220 2040
            sleep 4
            adb shell uiautomator dump /sdcard/prime270-decks.xml
            adb pull /sdcard/prime270-decks.xml /tmp/prime270-proof/decks-accessibility.xml
            grep -q 'Nouveau deck' /tmp/prime270-proof/decks-accessibility.xml
            ! grep -qi "isn.*responding" /tmp/prime270-proof/decks-accessibility.xml
            ! grep -q 'Vérifier les mises à jour' /tmp/prime270-proof/decks-accessibility.xml
            adb shell screencap -p /sdcard/prime270-decks.png
            adb pull /sdcard/prime270-decks.png /tmp/prime270-proof/decks-screen.png
            echo 'PRIME OTA 2.5.4 -> 2.7.0 PASSED WITHOUT APK REINSTALL'
      - name: Upload reproducible QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime270-ota-and-offline-qa
          path: /tmp/prime270-proof/
          if-no-files-found: warn
