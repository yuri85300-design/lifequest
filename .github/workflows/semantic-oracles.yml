name: 7 Gigs PRIME - independent semantic oracles
on:
  push:
    paths:
      - 'native/engine.js'
      - 'native/semantic_oracles.cjs'
      - 'native/semantic_oracles_extra.cjs'
      - 'native/semantic_oracles_interactions.cjs'
      - 'native/semantic_oracles_programs.cjs'
      - 'native/semantic_oracles_advanced.cjs'
      - 'native/semantic_oracles_advanced2.cjs'
      - 'native/semantic_oracles_complex_one.cjs'
      - 'native/semantic_oracles_last_a.cjs'
      - 'native/semantic_oracles_last_b.cjs'
      - 'native/semantic_oracles_branches.cjs'
      - 'native/semantic_oracles_quick_contracts.cjs'
      - 'native/semantic_oracles_relic_contracts.cjs'
      - 'native/official_independent_oracles.cjs'
      - 'native/nocturne_official_oracles.cjs'
      - 'native/official_clause_witnesses.cjs'
      - 'native/card_lifecycle_oracles.cjs'
      - 'native/semantic_oracle_runner.cjs'
      - 'native/semantic_register.cjs'
      - 'native/semantic_mutation_audit.cjs'
      - '.github/workflows/semantic-oracles.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/semantic-oracles.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent per-card behaviour oracles
        run: node native/semantic_oracle_runner.cjs
      - name: Verify independent oracles detect deliberately wrong rule variants
        run: node native/semantic_mutation_audit.cjs
      - name: Check 150 individual card lifecycle scenarios
        run: node native/card_lifecycle_oracles.cjs
      - name: Generate uncensored certification ledger
        if: always()
        run: node native/semantic_register.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prime-semantic-evidence
          path: |
            audit-results/semantic-oracles.json
            audit-results/semantic-mutation.json
            audit-results/semantic-register.json
            audit-results/semantic-gaps.md
            audit-results/card-lifecycle.json
          if-no-files-found: error
      - name: Assert NIGHTMARE remains certification-locked
        run: grep -q 'const NIGHTMARE_TRAINING_CERTIFIED = false' native/prime_v220_runtime.html
