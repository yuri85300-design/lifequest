name: PRIME 2.8.0 - Les Cendres du Signal - validation complete
on:
  push:
    branches: [main]
    paths:
      - 'native/prime_v280_runtime.html'
      - 'native/story_campaign_280.cjs'
      - 'native/story_ui_280.cjs'
      - 'native/story_campaign_280.test.cjs'
      - '.github/workflows/story-prime280-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: story-prime280-validation
  cancel-in-progress: true
jobs:
  story:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Construire le paquet reel PRIME 2.8.0
        run: |
          python3 native/build_ota_content.py --source native/prime_v280_runtime.html --version 2.8.0 --version-code 28000 --out /tmp/prime280-story
      - name: Verifier 15 chapitres, 150 cartes, 300 questions, sauvegardes et victoires reelles
        run: |
          node native/story_campaign_280.test.cjs /tmp/prime280-story | tee /tmp/story280-test.json
          grep -Fq '"status": "PASS"' /tmp/story280-test.json
      - name: Publier les preuves de validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime280-story-validation
          path: |
            /tmp/story280-test.json
            /tmp/prime280-story/latest.json
          if-no-files-found: warn
