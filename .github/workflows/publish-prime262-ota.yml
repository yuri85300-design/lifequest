name: PRIME OTA 2.6.2 - Mise a jour sans APK
on:
  push:
    branches: [main]
    paths:
      - 'native/prime_v262_runtime.html'
      - 'native/audit_260.cjs'
      - 'native/audit_261.cjs'
      - 'native/audit_262.cjs'
      - 'native/audit_257.cjs'
      - 'native/build_ota_content.py'
      - '.github/workflows/publish-prime262-ota.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Construire un paquet du jeu sans APK ni illustrations
        shell: bash
        run: |
          set -euo pipefail
          python3 native/build_ota_content.py --source native/prime_v262_runtime.html --version 2.6.2 --version-code 26002 --out /tmp/prime-ota
      - name: Compatibilite avec la coque Android 2.5.4 et suivantes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          path=Path('/tmp/prime-ota/latest.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          manifest['min_shell']=25004
          manifest['notes']='Guidage des duels, visuels responsive, filtre de decks reel et campagne solo ; sauvegardes conservees.'
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('MANIFEST_262',manifest['version_code'],manifest['min_shell'])
          PY
      - name: Valider les regles et les duels AVANT publication
        shell: bash
        run: |
          set -euo pipefail
          PRIME_ENGINE_PATH=/tmp/prime-ota/engine.js node --max-old-space-size=512 native/audit_230.cjs > /tmp/prime-ota/audit-resume.json
          PRIME_ENGINE_PATH=/tmp/prime-ota/engine.js node --max-old-space-size=512 native/audit_220.cjs > /tmp/prime-ota/audit-regles.json
          grep -Fq '"TECHNICAL_PASS_NOT_OFFICIAL_CERTIFIED"' /tmp/prime-ota/audit-regles.json
          PRIME_HTML=native/prime_v262_runtime.html node native/audit_252.cjs | tee /tmp/prime-ota/audit-academie.json
          grep -Fq '"publicReplay": "PASS"' /tmp/prime-ota/audit-academie.json
          npm install --no-save --no-package-lock linkedom@0.18.12
          node -e "console.log('DOM parser:', require.resolve('linkedom'))"
          PRIME_HTML=native/prime_v262_runtime.html node native/audit_253.cjs | tee /tmp/prime-ota/audit-choix.json
          grep -Fq '"noNestedButtons": "PASS"' /tmp/prime-ota/audit-choix.json
          PRIME_HTML=native/prime_v262_runtime.html node native/audit_257.cjs | tee /tmp/prime-ota/audit-menu257.json
          grep -Fq '"menuOnlyUpdates": "PASS"' /tmp/prime-ota/audit-menu257.json
          node --check native/audit_260.cjs
          PRIME_HTML=native/prime_v262_runtime.html node native/audit_260.cjs | tee /tmp/prime-ota/audit-menu.json
          PRIME_HTML=native/prime_v262_runtime.html node native/audit_261.cjs | tee /tmp/prime-ota/audit-guide.json
          PRIME_HTML=native/prime_v262_runtime.html node native/audit_262.cjs | tee /tmp/prime-ota/audit-decks.json
          grep -Fq '"hideFilteredDecks": "PASS"' /tmp/prime-ota/audit-decks.json
          grep -Fq '"guideLive": "PASS"' /tmp/prime-ota/audit-guide.json
          grep -Fq '"campaignUnlock": "PASS"' /tmp/prime-ota/audit-menu.json
          grep -Fq '"humanResultsOnly": "PASS"' /tmp/prime-ota/audit-menu.json
      - name: Publication du contenu uniquement sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prime-content-v2.6.2
          name: PRIME - mise a jour sans APK - v2.6.2
          prerelease: false
          make_latest: false
          body: "Mise a jour HTML+IA pour l'application Android PRIME 2.5.4. Les 150 illustrations françaises restent dans l'APK et les sauvegardes sont conservees."
          files: /tmp/prime-ota/prime-content-v2.6.2.zip
          fail_on_unmatched_files: true
      - name: Mettre a jour le manifeste uniquement apres publication et tests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TARGET=repos/yuri85300-design/lifequest/contents/updates/latest.json
          SHA="$(gh api "$TARGET" --jq '.sha' 2>/dev/null || true)"
          BODY="$(base64 -w 0 /tmp/prime-ota/latest.json)"
          if [ -n "$SHA" ]; then
            gh api "$TARGET" -X PUT -f message="release: PRIME 2.6.2 content OTA manifest [skip ci]" -f content="$BODY" -f branch=main -f sha="$SHA" --jq '.commit.sha'
          else
            gh api "$TARGET" -X PUT -f message="release: PRIME 2.6.2 content OTA manifest [skip ci]" -f content="$BODY" -f branch=main --jq '.commit.sha'
          fi
      - name: Conserver les preuves de la publication
        uses: actions/upload-artifact@v4
        with:
          name: prime262-ota-validation
          path: |
            /tmp/prime-ota/latest.json
            /tmp/prime-ota/audit-regles.json
            /tmp/prime-ota/audit-resume.json
            /tmp/prime-ota/audit-academie.json
            /tmp/prime-ota/audit-choix.json
            /tmp/prime-ota/audit-menu.json
            /tmp/prime-ota/audit-menu257.json
            /tmp/prime-ota/audit-guide.json
            /tmp/prime-ota/audit-decks.json
          if-no-files-found: error
