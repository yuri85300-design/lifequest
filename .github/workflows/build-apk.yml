name: Construire APK Android 7 Gigs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    name: APK Android avec SDK officiel
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Décompresser les sources Android
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode android-project-source.b64 > /tmp/7gigs-android.zip
          echo '66767788b77ca758221c9f1fe9e4eeee82f9a0cba7af8b09e3f077cbdb7fd2df  /tmp/7gigs-android.zip' | sha256sum -c -
          mkdir -p android-project
          unzip -q /tmp/7gigs-android.zip -d android-project
          test -f android-project/app/build.gradle
          test -f android-project/app/src/main/java/dev/septgigs/neonarena/MainActivity.java
          test -f android-project/app/src/main/assets/www/index.html
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Utiliser le SDK Android du runner
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          command -v sdkmanager
          sdkmanager --list_installed | head -35
      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Installer Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compiler une vraie APK de test
        working-directory: android-project
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Vérifier l'APK obtenue
        run: |
          test -s android-project/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-project/app/build/outputs/apk/debug/app-debug.apk | head -12
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-project/app/build/outputs/apk/debug/app-debug.apk
      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: 7Gigs-Neon-Arena-APK-test
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Rendre l'APK de test téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-v1.0.0
          name: 7 Gigs — APK Android de test (signature provisoire)
          body: |
            APK de test compilée avec Android SDK et vérifiée par apksigner.
            À installer directement sur Android (hors Google Play).
            Attention : cette version DEBUG utilise une signature provisoire, qui ne garantit PAS la conservation des données lors d'une future mise à jour.
            Exportez vos decks et la mémoire de NIGHTMARE avant de passer à une version signée pour la production.
          prerelease: true
          files: android-project/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
