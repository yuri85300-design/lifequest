name: 7 Gigs PRIME 2.3.0 - Android 15 QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-smoke-prime230.yml'
  workflow_run:
    workflows: ["7 Gigs PRIME 2.3.0 - Build APK officiel"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Download signed APK from PRIME 2.3.0 release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prime230-qa
          curl --fail --location --retry 4 --retry-delay 3 -o /tmp/prime230.apk 'https://github.com/yuri85300-design/lifequest/releases/download/prime-v2.3.0/7Gigs-PRIME-2.3.0.apk'
          unzip -t /tmp/prime230.apk | tail -3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Pillow for visual screen validation
        run: python3 -m pip install --quiet pillow
      - name: Install, launch and check PRIME 2.3.0 on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -e
            adb install -r /tmp/prime230.apk
            adb shell pm list packages > /tmp/prime230-qa/packages.txt
            grep -Fx 'package:dev.septgigs.neonarena.prime230' /tmp/prime230-qa/packages.txt
            adb logcat -c
            adb shell am start -W -n dev.septgigs.neonarena.prime230/dev.septgigs.neonarena.prime.Prime2Activity | tee /tmp/prime230-qa/launch.txt
            sleep 8
            adb shell screencap -p /sdcard/prime230-initial.png
            adb pull /sdcard/prime230-initial.png /tmp/prime230-qa/screenshot-initial.png
            # A cold WebView on an emulator can render late; do not certify a blank screen.
            sleep 22
            adb shell dumpsys activity activities > /tmp/prime230-qa/activity.txt
            adb logcat -d > /tmp/prime230-qa/logcat.txt
            adb shell screencap -p /sdcard/prime230.png
            adb pull /sdcard/prime230.png /tmp/prime230-qa/screenshot.png
            grep -q 'dev.septgigs.neonarena.prime230' /tmp/prime230-qa/activity.txt
            if grep -q 'FATAL EXCEPTION' /tmp/prime230-qa/logcat.txt; then exit 1; fi
            if grep -E '7Gigs-PRIME.*JS.*(Uncaught|SyntaxError|ReferenceError)' /tmp/prime230-qa/logcat.txt; then exit 1; fi
            if grep -E 'ANR in .*prime230|InputDispatcher.*prime230.*unresponsive' /tmp/prime230-qa/logcat.txt; then
              echo 'Android ANR detected'; exit 1
            fi
            python3 - <<'PY'
            from PIL import Image
            im=Image.open('/tmp/prime230-qa/screenshot.png').convert('RGB')
            center=im.crop((0,im.height//6,im.width,im.height*5//6))
            distinct=len(center.resize((200,200)).getcolors(40000) or [])
            print('Final screenshot distinct RGB values:',distinct)
            if distinct < 50:raise SystemExit('Blank screen: UI has not rendered')
            PY
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime230-android15-smoke
          path: /tmp/prime230-qa/
          if-no-files-found: warn
