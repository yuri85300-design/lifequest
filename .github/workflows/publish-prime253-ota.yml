name: PRIME OTA 2.5.3 - Mise a jour sans APK
on:
  push:
    branches: [main]
    paths:
      - 'native/prime_v253_runtime.html'
      - 'native/build_ota_content.py'
      - '.github/workflows/publish-prime253-ota.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Construire un paquet du jeu sans APK ni illustrations
        shell: bash
        run: |
          set -euo pipefail
          python3 native/build_ota_content.py --source native/prime_v253_runtime.html --version 2.5.3 --version-code 25003 --out /tmp/prime-ota
      - name: Valider les regles et les duels AVANT publication
        shell: bash
        run: |
          set -euo pipefail
          PRIME_ENGINE_PATH=/tmp/prime-ota/engine.js node --max-old-space-size=512 native/audit_230.cjs > /tmp/prime-ota/audit-resume.json
          PRIME_ENGINE_PATH=/tmp/prime-ota/engine.js node --max-old-space-size=512 native/audit_220.cjs > /tmp/prime-ota/audit-regles.json
          grep -Fq '"TECHNICAL_PASS_NOT_OFFICIAL_CERTIFIED"' /tmp/prime-ota/audit-regles.json
          PRIME_HTML=native/prime_v253_runtime.html node native/audit_253.cjs | tee /tmp/prime-ota/audit-academie.json
          grep -Fq '"publicReplay": "PASS"' /tmp/prime-ota/audit-academie.json
          npm install --no-save --no-package-lock linkedom@0.18.12
          node -e "console.log('DOM parser:', require.resolve('linkedom'))"
          PRIME_HTML=native/prime_v253_runtime.html node native/audit_253.cjs | tee /tmp/prime-ota/audit-choix.json
          grep -Fq '"noNestedButtons": "PASS"' /tmp/prime-ota/audit-choix.json
      - name: Publication du contenu uniquement sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prime-content-v2.5.3
          name: PRIME - mise a jour sans APK - v2.5.3
          prerelease: false
          make_latest: false
          body: "Mise a jour HTML+IA pour l'application Android PRIME 2.5.0. Les 150 illustrations françaises restent dans l'APK et les sauvegardes sont conservees."
          files: /tmp/prime-ota/prime-content-v2.5.3.zip
          fail_on_unmatched_files: true
      - name: Mettre a jour le manifeste uniquement apres publication et tests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TARGET=repos/yuri85300-design/lifequest/contents/updates/latest.json
          SHA="$(gh api "$TARGET" --jq '.sha' 2>/dev/null || true)"
          BODY="$(base64 -w 0 /tmp/prime-ota/latest.json)"
          if [ -n "$SHA" ]; then
            gh api "$TARGET" -X PUT -f message="release: PRIME 2.5.3 content OTA manifest [skip ci]" -f content="$BODY" -f branch=main -f sha="$SHA" --jq '.commit.sha'
          else
            gh api "$TARGET" -X PUT -f message="release: PRIME 2.5.3 content OTA manifest [skip ci]" -f content="$BODY" -f branch=main --jq '.commit.sha'
          fi
      - name: Conserver les preuves de la publication
        uses: actions/upload-artifact@v4
        with:
          name: prime253-ota-validation
          path: |
            /tmp/prime-ota/latest.json
            /tmp/prime-ota/audit-regles.json
            /tmp/prime-ota/audit-resume.json
            /tmp/prime-ota/audit-academie.json
            /tmp/prime-ota/audit-choix.json
          if-no-files-found: error
