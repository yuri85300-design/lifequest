name: PRIME 2.8.1 - Les Cendres du Signal - entrainement tactique
on:
  push:
    branches: [main]
    paths:
      - 'native/prime_v281_runtime.html'
      - 'native/story_campaign_281.cjs'
      - 'native/story_ui_281.cjs'
      - 'native/story_campaign_281.test.cjs'
      - '.github/workflows/story-prime281-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: story-prime281-validation
  cancel-in-progress: true
jobs:
  story:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Construire le paquet reel PRIME 2.8.1
        run: |
          python3 native/build_ota_content.py --source native/prime_v281_runtime.html --version 2.8.1 --version-code 28001 --out /tmp/prime281-story
      - name: Verifier 15 chapitres, 150 cartes, 150 decisions, 15 paires et la migration des sauvegardes
        run: |
          node native/story_campaign_281.test.cjs /tmp/prime281-story | tee /tmp/story281-test.json
          grep -Fq '"status": "PASS"' /tmp/story281-test.json
      - name: Publier les preuves de validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime281-story-validation
          path: |
            /tmp/story281-test.json
            /tmp/prime281-story/latest.json
          if-no-files-found: warn
