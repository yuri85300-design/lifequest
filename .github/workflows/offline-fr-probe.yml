name: Diagnostic cartes VF officielles PRIME
on:
  push:
    branches: [main]
    paths:
      - 'native/offline_fr_probe.py'
      - '.github/workflows/offline-fr-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Interroger les variantes VF de la base officielle (metadonnees seulement)
        run: python3 native/offline_fr_probe.py | tee /tmp/vf-probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-vf-prime
          path: /tmp/vf-probe.txt
