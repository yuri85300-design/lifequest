name: 7 Gigs PRIME - Android debug APK
on:
  push:
    paths:
      - 'android/**'
      - 'native/prime_v220_runtime.html'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle same runtime as web in APK
        run: |
          mkdir -p android/app/src/main/assets
          cp native/prime_v220_runtime.html android/app/src/main/assets/prime_v220_runtime.html
      - name: Compile and sign debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: seven-gigs-prime-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
