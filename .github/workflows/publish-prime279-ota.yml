name: PRIME OTA 2.7.9 - Correctifs NOVICE RAGE
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-prime278-ota.yml'
      - 'native/prime_v279_runtime.html'
      - 'native/collection_advisor.cjs'
      - 'native/novice_qa_agent.cjs'
      - 'native/novice_qa_rage.cjs'
      - 'native/audit_271.cjs'
      - 'native/audit_271_puzzles.cjs'
      - 'native/audit_271_ai.cjs'
      - 'native/audit_272.cjs'
      - 'native/audit_261.cjs'
      - 'native/audit_262.cjs'
      - 'native/audit_263.cjs'
      - 'native/audit_270.cjs'
      - 'native/audit_271_ai.cjs'
      - 'native/audit_271_puzzles.cjs'
      - 'native/ota_manifest_guard.py'
      - 'native/audit_ota_guard.py'
      - 'multiplayer/protocol.mjs'
      - 'multiplayer/protocol.test.mjs'
      - 'native/audit_257.cjs'
      - 'native/build_ota_content.py'
      - 'native/engine.js'
      - 'native/extract_engine.cjs'
      - 'native/audit_275_chaos.cjs'
      - 'native/deck_editor_276.cjs'
      - 'native/deck_drafts_277.cjs'
      - 'native/collection_layout_278.cjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Construire un paquet du jeu sans APK ni illustrations
        shell: bash
        run: |
          set -euo pipefail
          python3 native/build_ota_content.py --source native/prime_v279_runtime.html --version 2.7.9 --version-code 27009 --out /tmp/prime-ota
      - name: Compatibilite avec la coque Android 2.5.4 et suivantes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          path=Path('/tmp/prime-ota/latest.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          manifest['min_shell']=25004
          manifest['notes']='NOVICE RAGE : decks proteges contre sauvegardes corrompues, import CSV corrige et accessibilite amelioree. Sauvegardes conservees.'
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('MANIFEST_279',manifest['version_code'],manifest['min_shell'])
          PY
      - name: Le moteur teste est exactement le moteur publie
        shell: bash
        run: |
          set -euo pipefail
          node native/extract_engine.cjs --check
          cmp native/engine.js /tmp/prime-ota/engine.js
          echo "ENGINE_TESTED_EQUALS_ENGINE_SHIPPED=YES"
      - name: Regles des 150 cartes, mutations et compatibilite croisee
        shell: bash
        run: |
          set -euo pipefail
          node native/semantic_oracle_runner.cjs | tee /tmp/prime-ota/audit-oracles.txt
          grep -Fq '"failed":0' /tmp/prime-ota/audit-oracles.txt
          node native/card_lifecycle_oracles.cjs | tee /tmp/prime-ota/audit-lifecycle.txt
          node native/semantic_mutation_audit.cjs | tee /tmp/prime-ota/audit-mutation.txt
          node native/nightmare_training_contract.cjs
          PRIME_ENGINE_PATH=/tmp/prime-ota/engine.js node native/nightmare_forge_test.cjs | tee /tmp/prime-ota/audit-nightmare-forge.json
          grep -Fq '"status": "PASS"' /tmp/prime-ota/audit-nightmare-forge.json
          CHAOS_GAMES=3000 PRIME_ENGINE_PATH=/tmp/prime-ota/engine.js node native/audit_275_chaos.cjs > /tmp/prime-ota/audit-chaos.json
          grep -Fq '"status": "PASS"' /tmp/prime-ota/audit-chaos.json
      - name: Editeur de deck et brouillons (ajout libre, reprise, sauvegarde auto)
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node native/deck_editor_276.cjs /tmp/prime-ota index.html | tee /tmp/prime-ota/audit-deck-editor.json
          grep -Fq '"status": "PASS"' /tmp/prime-ota/audit-deck-editor.json
          node native/deck_drafts_277.cjs /tmp/prime-ota index.html | tee /tmp/prime-ota/audit-deck-drafts.json
          grep -Fq '"status": "PASS"' /tmp/prime-ota/audit-deck-drafts.json
          node native/collection_layout_278.cjs /tmp/prime-ota index.html | tee /tmp/prime-ota/audit-collection-layout.json
          grep -Fq '"status": "PASS"' /tmp/prime-ota/audit-collection-layout.json
      - name: Valider les regles et les duels AVANT publication
        shell: bash
        run: |
          set -euo pipefail
          PRIME_ENGINE_PATH=/tmp/prime-ota/engine.js node --max-old-space-size=512 native/audit_230.cjs > /tmp/prime-ota/audit-resume.json
          PRIME_ENGINE_PATH=/tmp/prime-ota/engine.js node --max-old-space-size=512 native/audit_220.cjs > /tmp/prime-ota/audit-regles.json
          grep -Fq '"TECHNICAL_PASS_NOT_OFFICIAL_CERTIFIED"' /tmp/prime-ota/audit-regles.json
          PRIME_HTML=native/prime_v263_runtime.html node native/audit_252.cjs | tee /tmp/prime-ota/audit-academie.json
          grep -Fq '"publicReplay": "PASS"' /tmp/prime-ota/audit-academie.json
          npm install --no-save --no-package-lock linkedom@0.18.12
          node -e "console.log('DOM parser:', require.resolve('linkedom'))"
          PRIME_HTML=native/prime_v279_runtime.html node native/audit_253.cjs | tee /tmp/prime-ota/audit-choix.json
          grep -Fq '"noNestedButtons": "PASS"' /tmp/prime-ota/audit-choix.json
          PRIME_HTML=native/prime_v279_runtime.html node native/audit_257.cjs | tee /tmp/prime-ota/audit-menu257.json
          grep -Fq '"menuOnlyUpdates": "PASS"' /tmp/prime-ota/audit-menu257.json
          node --check native/audit_271.cjs
          PRIME_HTML=native/prime_v279_runtime.html node native/audit_271.cjs | tee /tmp/prime-ota/audit-menu.json
          PRIME_HTML=native/prime_v279_runtime.html node native/audit_272.cjs | tee /tmp/prime-ota/audit-replay-coach.json
          grep -Fq '"noHiddenData":"PASS"' /tmp/prime-ota/audit-replay-coach.json
          PRIME_HTML=native/prime_v279_runtime.html node native/audit_261.cjs | tee /tmp/prime-ota/audit-guide.json
          PRIME_HTML=native/prime_v279_runtime.html node native/audit_262.cjs | tee /tmp/prime-ota/audit-decks.json
          PRIME_HTML=native/prime_v279_runtime.html node native/audit_263.cjs | tee /tmp/prime-ota/audit-actor.json
          PRIME_HTML=native/prime_v279_runtime.html node native/audit_271_puzzles.cjs | tee /tmp/prime-ota/audit-puzzles270.json
          PRIME_HTML=native/prime_v279_runtime.html node native/audit_270.cjs | tee /tmp/prime-ota/audit-strategy.json
          PRIME_HTML=native/prime_v279_runtime.html node native/audit_271_ai.cjs | tee /tmp/prime-ota/audit-ai.json
          python3 native/audit_ota_guard.py | tee /tmp/prime-ota/audit-manifest-guard.json
          node multiplayer/protocol.test.mjs | tee /tmp/prime-ota/audit-pvp-foundation.json
          grep -Fq '"opponentCannotUnlockGuide": "PASS"' /tmp/prime-ota/audit-actor.json
          grep -Fq '"deckProbabilities": "PASS"' /tmp/prime-ota/audit-strategy.json
          grep -Fq '"nightmareDiagnostic": "PASS"' /tmp/prime-ota/audit-ai.json
          grep -Fq '"manifestNoDowngrade": "PASS"' /tmp/prime-ota/audit-manifest-guard.json
          grep -Fq '"serverLegalActions":"PASS"' /tmp/prime-ota/audit-pvp-foundation.json
          grep -Fq '"hideFilteredDecks": "PASS"' /tmp/prime-ota/audit-decks.json
          grep -Fq '"guideLive": "PASS"' /tmp/prime-ota/audit-guide.json
          grep -Fq '"campaignUnlock": "PASS"' /tmp/prime-ota/audit-menu.json
          grep -Fq '"humanResultsOnly": "PASS"' /tmp/prime-ota/audit-menu.json
      - name: Bloquer la publication si NOVICE ou NOVICE RAGE decouvrent une regression
        shell: bash
        env:
          NOVICE_TARGET_VERSION: '2.7.9'
          RAGE_SEED: '278001'
          RAGE_ACTIONS: '55'
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.1 axe-core@4.10.3
          node native/novice_qa_agent.cjs /tmp/prime-ota /tmp/prime-ota/novice-report
          node native/novice_qa_rage.cjs /tmp/prime-ota /tmp/prime-ota/novice-rage-report
      - name: Publication du contenu uniquement sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prime-content-v2.7.9
          name: PRIME - mise a jour sans APK - v2.7.9
          prerelease: false
          make_latest: false
          body: "PRIME 2.7.9 : securisation des decks et sauvegardes, import CSV, accessibilite et navigation. Sauvegardes conservees."
          files: /tmp/prime-ota/prime-content-v2.7.9.zip
          fail_on_unmatched_files: true
      - name: Actualiser le manifeste uniquement si sa version augmente
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 native/ota_manifest_guard.py --manifest /tmp/prime-ota/latest.json
      - name: Conserver les preuves de la publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime279-ota-validation
          path: |
            /tmp/prime-ota/novice-report/
            /tmp/prime-ota/novice-rage-report/
            /tmp/prime-ota/latest.json
            /tmp/prime-ota/audit-regles.json
            /tmp/prime-ota/audit-resume.json
            /tmp/prime-ota/audit-academie.json
            /tmp/prime-ota/audit-choix.json
            /tmp/prime-ota/audit-menu.json
            /tmp/prime-ota/audit-replay-coach.json
            /tmp/prime-ota/audit-menu257.json
            /tmp/prime-ota/audit-guide.json
            /tmp/prime-ota/audit-decks.json
            /tmp/prime-ota/audit-actor.json
            /tmp/prime-ota/audit-puzzles270.json
            /tmp/prime-ota/audit-strategy.json
            /tmp/prime-ota/audit-ai.json
            /tmp/prime-ota/audit-manifest-guard.json
            /tmp/prime-ota/audit-pvp-foundation.json
            /tmp/prime-ota/audit-oracles.txt
            /tmp/prime-ota/audit-lifecycle.txt
            /tmp/prime-ota/audit-mutation.txt
            /tmp/prime-ota/audit-chaos.json
            /tmp/prime-ota/audit-deck-editor.json
            /tmp/prime-ota/audit-deck-drafts.json
            /tmp/prime-ota/audit-collection-layout.json
            /tmp/prime-ota/audit-nightmare-forge.json
          if-no-files-found: warn
