name: PRIME - Prototype du serveur multijoueur (hors ligne uniquement)
on:
  push:
    branches: [main]
    paths:
      - 'multiplayer/protocol.mjs'
      - 'multiplayer/protocol.test.mjs'
      - 'multiplayer/match-coordinator.mjs'
      - 'multiplayer/match-coordinator.test.mjs'
      - '.github/workflows/multiplayer-protocol-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Valider les modules ESM serveur
        run: |
          node --check multiplayer/protocol.mjs
          node --check multiplayer/match-coordinator.mjs
          node --check multiplayer/match-coordinator.test.mjs
      - name: Controle legalite, authentification et donnees privees
        run: |
          set -euo pipefail
          node multiplayer/protocol.test.mjs | tee /tmp/pvp-protocol.json
          node multiplayer/match-coordinator.test.mjs | tee /tmp/pvp-match.json
          grep -Fq '"sessionAuth":"PASS"' /tmp/pvp-match.json
          grep -Fq '"antiReplay":"PASS"' /tmp/pvp-match.json
          grep -Fq '"onlineDeployment":"NOT_CONFIGURED"' /tmp/pvp-match.json
      - name: Enregistrer les preuves
        uses: actions/upload-artifact@v4
        with:
          name: prime-pvp-security-foundation
          path: |
            /tmp/pvp-protocol.json
            /tmp/pvp-match.json
