name: NOVICE RAGE - Audit hostile PRIME
on:
  push:
    branches: [main]
    paths:
      - 'native/novice_qa_agent.cjs'
      - 'native/novice_qa_rage.cjs'
      - 'native/prime_v*_runtime.html'
      - 'updates/latest.json'
      - 'native/build_ota_content.py'
      - '.github/workflows/novice-qa-agent.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: novice-rage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  novice:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Chromium pour l'agent d'exploration
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Determiner la derniere version OTA du jeu
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          import json
          manifest=json.loads(Path('updates/latest.json').read_text(encoding='utf-8'))
          version=str(manifest['version'])
          digits=version.replace('.','')
          if not digits.isdigit(): raise RuntimeError('Version non numerique')
          source=Path('native/prime_v'+digits+'_runtime.html')
          if not source.is_file(): raise RuntimeError('Runtime absent pour la version '+version+': '+str(source))
          print('NOVICE_TARGET_VERSION='+version)
          print('NOVICE_TARGET_CODE='+str(int(manifest['version_code'])))
          print('NOVICE_TARGET_SOURCE='+str(source))
          PY
      - name: Construire le vrai runtime OTA dans un bac a sable
        run: |
          python3 native/build_ota_content.py \
            --source "$NOVICE_TARGET_SOURCE" --version "$NOVICE_TARGET_VERSION" \
            --version-code "$NOVICE_TARGET_CODE" --out /tmp/prime278-novice
      - name: Lancer l'agent NOVICE sur profil vierge, mobile et ordinateur
        id: audit
        continue-on-error: true
        run: |
          node native/novice_qa_agent.cjs /tmp/prime278-novice /tmp/novice-report
      - name: Lancer NOVICE RAGE - fuzz, accessibilite et parcours hostiles
        id: rage
        continue-on-error: true
        env:
          RAGE_SEED: '278001'
          RAGE_ACTIONS: '55'
        run: |
          node native/novice_qa_rage.cjs /tmp/prime278-novice /tmp/novice-rage-report
      - name: Publier les constatations dans le resume du job
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/novice-report/novice-agent-report.md ]; then
            cat /tmp/novice-report/novice-agent-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "L'agent n'a pas produit de rapport. Verifier les journaux." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f /tmp/novice-rage-report/novice-rage-report.md ]; then
            cat /tmp/novice-rage-report/novice-rage-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "NOVICE RAGE : rapport absent." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archiver rapport JSON, Markdown et captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novice-rage-qa-report
          path: |
            /tmp/novice-report/
            /tmp/novice-rage-report/
          if-no-files-found: warn
      - name: Refuser les anomalies critiques ET majeures
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          RAGE_OUTCOME: ${{ steps.rage.outcome }}
        run: |
          if [ "$AUDIT_OUTCOME" != "success" ] || [ "$RAGE_OUTCOME" != "success" ]; then
            echo "::error::Audit en echec : anomalie majeure/critique ou erreur d'execution. Lire les rapports NOVICE et RAGE."
            exit 1
          fi
