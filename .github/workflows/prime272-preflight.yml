name: PRIME 2.7.2 - Prerequis de publication et tests du guide
on:
  push:
    branches: [main]
    paths:
      - 'native/prime_v272_runtime.html'
      - 'native/audit_261.cjs'
      - 'native/audit_262.cjs'
      - 'native/audit_271_puzzles.cjs'
      - 'native/audit_270.cjs'
      - 'native/audit_271_ai.cjs'
      - 'native/audit_272.cjs'
      - 'native/audit_270_league.cjs'
      - 'native/ota_manifest_guard.py'
      - 'native/audit_ota_guard.py'
      - 'multiplayer/protocol.mjs'
      - 'multiplayer/protocol.test.mjs'
      - '.github/workflows/prime272-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Assembler le runtime et verifier les scripts JavaScript
        run: |
          set -euo pipefail
          python3 native/build_ota_content.py --source native/prime_v272_runtime.html --version 2.7.2 --version-code 27002 --out /tmp/prime272-preflight
          node --check /tmp/prime272-preflight/inline.js
          node --check /tmp/prime272-preflight/ai-worker.js
          node --check native/audit_261.cjs
      - name: Valider 150 cartes et les sauvegardes avec le vrai moteur
        run: |
          set -euo pipefail
          PRIME_ENGINE_PATH=/tmp/prime272-preflight/engine.js node --max-old-space-size=512 native/audit_230.cjs | tee /tmp/prime272-preflight/audit-resume.json
          PRIME_ENGINE_PATH=/tmp/prime272-preflight/engine.js node --max-old-space-size=512 native/audit_220.cjs | tee /tmp/prime272-preflight/audit-engine.json
          grep -Fq '"TECHNICAL_PASS_NOT_OFFICIAL_CERTIFIED"' /tmp/prime272-preflight/audit-engine.json
      - name: UI, menus, campagnes, palmares et tutoriel live
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock linkedom@0.18.12
          PRIME_HTML=native/prime_v272_runtime.html node native/audit_257.cjs | tee /tmp/prime272-preflight/audit-menu.json
          PRIME_HTML=native/prime_v272_runtime.html node native/audit_271.cjs | tee /tmp/prime272-preflight/audit-features.json
          PRIME_HTML=native/prime_v272_runtime.html node native/audit_272.cjs | tee /tmp/prime272-preflight/audit-replay-coach.json
          grep -Fq '"noHiddenData":"PASS"' /tmp/prime272-preflight/audit-replay-coach.json
          PRIME_HTML=native/prime_v272_runtime.html node native/audit_261.cjs | tee /tmp/prime272-preflight/audit-guide.json
          PRIME_HTML=native/prime_v272_runtime.html node native/audit_262.cjs | tee /tmp/prime272-preflight/audit-decks.json
          PRIME_HTML=native/prime_v272_runtime.html node native/audit_263.cjs | tee /tmp/prime272-preflight/audit-guide-actor.json
          PRIME_HTML=native/prime_v272_runtime.html node native/audit_271_puzzles.cjs | tee /tmp/prime272-preflight/audit-puzzles-v270.json
          PRIME_HTML=native/prime_v272_runtime.html node native/audit_270.cjs | tee /tmp/prime272-preflight/audit-strategy.json
          PRIME_HTML=native/prime_v272_runtime.html node native/audit_271_ai.cjs | tee /tmp/prime272-preflight/audit-ai.json
          grep -Fq '"nightmareDiagnostic": "PASS"' /tmp/prime272-preflight/audit-ai.json
          grep -Fq '"deckProbabilities": "PASS"' /tmp/prime272-preflight/audit-strategy.json
          grep -Fq '"academyMissions":' /tmp/prime272-preflight/audit-puzzles-v270.json
          grep -Fq '"opponentCannotUnlockGuide": "PASS"' /tmp/prime272-preflight/audit-guide-actor.json
          grep -Fq '"hideFilteredDecks": "PASS"' /tmp/prime272-preflight/audit-decks.json
          grep -Fq '"guideLive": "PASS"' /tmp/prime272-preflight/audit-guide.json
          grep -Fq '"campaignUnlock": "PASS"' /tmp/prime272-preflight/audit-features.json
          PRIME_HTML=native/prime_v263_runtime.html node native/audit_252.cjs | tee /tmp/prime272-preflight/audit-puzzles-legacy.json
          PRIME_HTML=native/prime_v272_runtime.html node native/audit_253.cjs | tee /tmp/prime272-preflight/audit-choice.json
      - name: 40 vrais duels et aucune victoire artificielle
        run: |
          set -euo pipefail
          PRIME_HTML=native/prime_v272_runtime.html node native/audit_260_benchmark.cjs | tee /tmp/prime272-preflight/audit-benchmark.json
          grep -Fq '"noFakeWins": "PASS"' /tmp/prime272-preflight/audit-benchmark.json
          PRIME_HTML=native/prime_v272_runtime.html node native/audit_270_league.cjs | tee /tmp/prime272-preflight/audit-league.json
          grep -Fq '"TECHNICAL_PASS_NOT_NIGHTMARE_CERTIFICATION"' /tmp/prime272-preflight/audit-league.json
      - name: Regressions de version et fondations multijoueur (sans deploiement)
        shell: bash
        run: |
          set -euo pipefail
          python3 native/audit_ota_guard.py | tee /tmp/prime272-preflight/audit-version.json
          node multiplayer/protocol.test.mjs | tee /tmp/prime272-preflight/audit-protocol.json
          grep -Fq '"manifestNoDowngrade": "PASS"' /tmp/prime272-preflight/audit-version.json
          grep -Fq '"serverLegalActions":"PASS"' /tmp/prime272-preflight/audit-protocol.json
      - name: Conserver les preuves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime272-preflight-evidence
          path: /tmp/prime272-preflight/audit-*.json
          if-no-files-found: warn
